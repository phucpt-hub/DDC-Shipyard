name: Cập nhật báo cáo chuỗi thép

on:
  push:
    paths:
      - 'du_lieu/**'
      - 'cong_cu/**'
  workflow_dispatch:        # nút "Run workflow" để chạy tay
  schedule:                 # tự chạy lấy dữ liệu từ link: 06:52 và 15:52 giờ Việt Nam
    - cron: '52 23 * * *'
    - cron: '52 8 * * *'

permissions:
  contents: write
  pages: write

concurrency:
  group: cap-nhat-bao-cao
  cancel-in-progress: false

jobs:
  cap-nhat:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: cong_cu/requirements.txt

      - name: Cài thư viện
        run: pip install -r cong_cu/requirements.txt

      - name: Tải dữ liệu mới nhất từ link
        env:
          TZ: Asia/Ho_Chi_Minh
          NGUON_CUTTING: ${{ secrets.NGUON_CUTTING }}
          NGUON_KHO: ${{ secrets.NGUON_KHO }}
          NGUON_KHO_KHOA: ${{ secrets.NGUON_KHO_KHOA }}
          NGUON_NESTING: ${{ secrets.NGUON_NESTING }}
        run: python cong_cu/tai_du_lieu.py

      - name: Chạy phân tích và dựng báo cáo
        env:
          TZ: Asia/Ho_Chi_Minh
        run: python cong_cu/chay.py

      - name: Lưu báo cáo mới vào repo
        run: |
          git config user.name "bao-cao-tu-dong"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html lich_su nhat_ky_lam_sach.xlsx
          if git diff --cached --quiet; then
            echo "Không có thay đổi"
          else
            git commit -m "Cập nhật báo cáo $(date +'%d/%m/%Y %H:%M')"
            git push
          fi

      - name: Yêu cầu GitHub Pages dựng lại trang
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds"
