<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: sticky control bar (project selector) → summary strip → chain flow → chart grid → detail tables. Mill-sheet feel: steel greys, one blue accent, semantic status colors. */
:root{
  --bg:#f3f5f6; --panel:#ffffff; --ink:#18232d; --muted:#5b6873; --line:#d9dfe3; --soft:#eaeef1;
  --accent:#1d5f86; --accent2:#7fa9c2; --good:#2f7d4f; --warn:#b7791f; --bad:#b3372e; --neutral:#9aa6af;
  --good-bg:#e5f2ea; --warn-bg:#fbf1dc; --bad-bg:#f8e3e0;
  --f-disp:"IBM Plex Sans Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"IBM Plex Sans",Arial,sans-serif;
  --f-mono:"IBM Plex Mono",Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12181d; --panel:#1a2229; --ink:#e3e9ee; --muted:#93a1ad; --line:#2d3942; --soft:#222c34;
  --accent:#5aa3cf; --accent2:#35607a; --good:#5fb783; --warn:#e0a84a; --bad:#e2695d; --neutral:#5d6a74;
  --good-bg:#1d3226; --warn-bg:#3a2e17; --bad-bg:#3d201d; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12181d; --panel:#1a2229; --ink:#e3e9ee; --muted:#93a1ad; --line:#2d3942; --soft:#222c34;
  --accent:#5aa3cf; --accent2:#35607a; --good:#5fb783; --warn:#e0a84a; --bad:#e2695d; --neutral:#5d6a74;
  --good-bg:#1d3226; --warn-bg:#3a2e17; --bad-bg:#3d201d; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:14px/1.5 var(--f-body);margin:0}
.wrap{max-width:1280px;margin:0 auto;padding-inline:16px;padding-block:0 48px}
h1,h2,h3{font-family:var(--f-disp);margin:0;text-wrap:balance;letter-spacing:.01em}
h1{font-size:22px;font-weight:700}
h2{font-size:18px;font-weight:600}
h3{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.num,td.n,th.n{font-variant-numeric:tabular-nums;font-family:var(--f-mono)}
.bar-top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.bar-top .wrap{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;padding-block:12px}
.brand{display:flex;flex-direction:column;min-width:0;flex:1 1 260px}
.brand small{color:var(--muted);font-size:12px}
.ctl{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
select,button,input[type=search]{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:7px 10px}
select{min-width:240px;max-width:100%;font-weight:600}
button{cursor:pointer}
button:hover,select:hover{border-color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tabs{display:flex;gap:2px;background:var(--soft);border-radius:8px;padding:3px}
.tabs button{border:0;background:transparent;padding:6px 12px;border-radius:6px;color:var(--muted);font-weight:500}
.tabs button[aria-pressed=true]{background:var(--panel);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
section{margin-top:22px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:10px}
.sec-h p{margin:0;color:var(--muted);font-size:12.5px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.kpi{background:var(--panel);padding:12px 14px;min-width:0}
.kpi .l{font-size:12px;color:var(--muted)}
.kpi .v{font:600 24px/1.2 var(--f-disp);font-variant-numeric:tabular-nums;margin-top:2px}
.kpi .v small{font-size:13px;font-weight:500;color:var(--muted);margin-left:3px}
.kpi .s{font-size:12px;color:var(--muted)}
.kpi.bad .v{color:var(--bad)} .kpi.warn .v{color:var(--warn)} .kpi.good .v{color:var(--good)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,520px),1fr));gap:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px 16px;min-width:0}
.card h3{margin-bottom:10px}
.card .note{font-size:12px;color:var(--muted);margin:8px 0 0}
/* chain */
.chain{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;border:1px solid var(--line);border-radius:8px;background:var(--panel);overflow:hidden}
.step{padding:14px 16px;position:relative;min-width:0;border-right:1px solid var(--line)}
.step:last-child{border-right:0}
.step:not(:last-child)::after{content:"";position:absolute;right:-8px;top:50%;width:14px;height:14px;background:var(--panel);border-top:1px solid var(--line);border-right:1px solid var(--line);transform:translateY(-50%) rotate(45deg);z-index:1}
.step .t{font:600 12px var(--f-disp);letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.step .v{font:600 22px/1.25 var(--f-disp);font-variant-numeric:tabular-nums}
.step .d{font-size:12px;color:var(--muted)}
.step .d b{color:var(--ink);font-weight:600}
@media (max-width:760px){.chain{grid-template-columns:1fr 1fr}.step:nth-child(2){border-right:0}.step:nth-child(-n+2){border-bottom:1px solid var(--line)}.step::after{display:none}}
/* html bars */
.hb{display:grid;grid-template-columns:minmax(90px,170px) minmax(0,1fr) auto;gap:6px 10px;align-items:center;font-size:13px}
.hb .lab{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb .lab.click{cursor:pointer;color:var(--accent)}
.hb .lab.click:hover{text-decoration:underline}
.track{height:16px;background:var(--soft);border-radius:3px;display:flex;overflow:hidden;min-width:0}
.track i{display:block;height:100%}
.hb .val{font:12px var(--f-mono);font-variant-numeric:tabular-nums;color:var(--muted);text-align:right;white-space:nowrap}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--muted);margin-bottom:8px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:10px;height:10px;border-radius:2px;display:inline-block}
.c-cut{background:var(--accent)} .c-rem{background:var(--soft);box-shadow:inset 0 0 0 1px var(--line)} .c-bg{background:var(--accent2)}
.c-own{background:var(--good)} .c-com{background:var(--warn)} .c-buy{background:var(--bad)} .c-neu{background:var(--neutral)}
svg text{fill:var(--muted);font:11px var(--f-mono)}
svg .grid-l{stroke:var(--line);stroke-width:1}
svg .axis{stroke:var(--muted);stroke-width:1}
/* tables */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--panel)}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{font:600 12px var(--f-disp);letter-spacing:.03em;color:var(--muted);background:var(--soft);position:sticky;top:0;cursor:pointer;user-select:none}
th.n,td.n{text-align:right}
tbody tr:hover{background:var(--soft)}
tr.click{cursor:pointer}
td.wrapc{white-space:normal;min-width:220px}
.mini{display:inline-block;width:70px;height:6px;background:var(--soft);border-radius:3px;vertical-align:middle;margin-left:6px;overflow:hidden}
.mini i{display:block;height:100%;background:var(--accent)}
.pill{display:inline-block;padding:1px 8px;border-radius:10px;font-size:11.5px;font-weight:600;white-space:nowrap}
.p-good{background:var(--good-bg);color:var(--good)} .p-warn{background:var(--warn-bg);color:var(--warn)} .p-bad{background:var(--bad-bg);color:var(--bad)} .p-neu{background:var(--soft);color:var(--muted)}
.alerts{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.alerts li{display:grid;grid-template-columns:4px minmax(0,1fr);gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:8px 12px 8px 0;font-size:13px;overflow:hidden}
.alerts li::before{content:"";background:var(--warn);margin:-8px 0}
.alerts li.bad::before{background:var(--bad)}
.alerts li b{font-weight:600}
.alerts li a{color:var(--accent);cursor:pointer;text-decoration:underline}
.ph{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px;align-items:flex-end}
.ph .meta{color:var(--muted);font-size:12.5px}
.stage{display:grid;grid-template-columns:110px minmax(0,1fr) 150px;gap:10px;align-items:center;font-size:13px;margin:6px 0}
.stage .track{height:12px}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:8px}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:14px;padding:3px 10px;font-size:12px;cursor:pointer}
.chip[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:#fff}
.empty{color:var(--muted);font-size:13px;padding:10px 0}
.flow{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.flow .col{display:flex;flex-direction:column;gap:4px}
.flow .blk{display:flex;justify-content:space-between;gap:8px;padding:6px 10px;border-radius:4px;font-size:12.5px;color:#fff;min-height:28px;align-items:center}
.flow .blk span:last-child{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.src-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:12px}
.src-list .card p{margin:4px 0;font-size:13px}
.src-list code{font-family:var(--f-mono);font-size:12px;background:var(--soft);padding:1px 5px;border-radius:3px}
#tip{position:fixed;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12px;padding:6px 9px;border-radius:5px;max-width:300px;z-index:50;display:none;white-space:pre-line}
@media (max-width:600px){.hb{grid-template-columns:minmax(70px,110px) minmax(0,1fr) auto}.stage{grid-template-columns:80px minmax(0,1fr) 110px}.flow{grid-template-columns:1fr}select{min-width:0;width:100%}.ctl{width:100%}}
@media (prefers-reduced-motion:no-preference){.track i{transition:width .3s}}
</style>

function hbars(rows,max,{click}={}){
  return `<div class="hb">${rows.map((r,i)=>{
    const segs=r.segs.map(s=>{const w=max?Math.max(0,s.v)/max*100:0;return w>0?`<i class="${s.c}" style="width:${w}%" data-tip="${esc(r.label)}\n${esc(s.n)}: ${T(s.v)} t"></i>`:''}).join('');
    return `<div class="lab${click?' click':''}" ${click?`data-go="${r.id}" role="button" tabindex="0"`:''} title="${esc(r.label)}">${esc(r.label)}</div><div class="track">${segs}</div><div class="val">${r.right??''}</div>`}).join('')}</div>`;
}
function nice(max){if(max<=0)return[1,[0,1]];const p=Math.pow(10,Math.floor(Math.log10(max)));const st=[1,2,2.5,5,10].map(k=>k*p).find(s=>max/s<=5);const top=Math.ceil(max/st)*st;const t=[];for(let v=0;v<=top+1e-9;v+=st)t.push(v);return[top,t]}

  labels.forEach((lb,i)=>{const x0=L+i*gw+(gw-bw*k)/2;

function sortable(root){root.querySelectorAll('th').forEach(th=>th.addEventListener('click',()=>{
  const tb=th.closest('table').tBodies[0],i=+th.dataset.i,asc=th.dataset.o!=='a';th.dataset.o=asc?'a':'d';
  const rows=[...tb.rows];rows.sort((a,b)=>{const x=a.cells[i].dataset.s,y=b.cells[i].dataset.s;const nx=parseFloat(x),ny=parseFloat(y);
    const r=(!isNaN(nx)&&!isNaN(ny))?nx-ny:x.localeCompare(y,'vi');return asc?r:-r});rows.forEach(r=>tb.appendChild(r))}))}
const pill=(c,t)=>`<span class="pill p-${c}">${esc(t)}</span>`;
const stPill=s=>pill(s==='Đã cắt xong'||s==='Đã cắt hết'?'good':s==='Đang cắt'||s==='Cắt dở'?'warn':s==='Chưa nạp Cutting'?'bad':'neu',s);

/* ---------- OVERVIEW ---------- */

  const alerts=P.flatMap(p=>p.alerts.map(a=>({...a,p})));
  alerts.sort((a,b)=>(a.s==='bad'?0:1)-(b.s==='bad'?0:1));
  const act=P.filter(p=>(p.pc??1)<0.999);
  let h=`<section><div class="sec-h"><h2>Toàn bộ ${t.n_proj} dự án</h2><p>Khối lượng theo List Chi Tiết của file Cutting · tấn</p></div>
  <div class="kpis">
   ${kpi('Tổng KL lệnh sản xuất',T(t.kl),'t',`${t.n_lsx} LSX`)}
   ${kpi('Đã cắt',PC(t.cut/t.req),'',`${T(t.cut)} t · còn ${T(remain)} t`,'good')}
   ${kpi('Đã bàn giao',PC(t.bg/t.kl),'',`${T(t.bg)} t`)}
   ${kpi('Dự án đang chạy',act.length,'',`${P.length-act.length} dự án đã cắt xong`)}
   ${kpi('Phôi cần cho nesting chưa cắt',T(b.need),'t','nguyên khổ, quy đổi từ Cutting')}
   ${kpi('Thiếu thép phải mua',T(b.buy),'t',`sau khi dùng tồn dự án + Kho chung`,'bad')}
  </div></section>

  <section><div class="sec-h"><h2>Dòng chảy vật tư</h2><p>Kho → Nesting → Cutting → Bàn giao</p></div>
  <div class="chain">
   <div class="step"><div class="t">Kho thép</div><div class="v">${T(k.ton)} t</div><div class="d">tồn hiện tại · Kho chung <b>${T(k.common)}</b> · BRAVO <b>${T(k.bravo)}</b></div></div>
   <div class="step"><div class="t">Nesting chờ cắt</div><div class="v">${T(b.need)} t</div><div class="d">đủ từ tồn dự án <b>${T(b.own)}</b> · Kho chung <b>${T(b.common)}</b> · thiếu <b style="color:var(--bad)">${T(b.buy)}</b></div></div>
   <div class="step"><div class="t">Cutting</div><div class="v">${T(t.cut)} t</div><div class="d">${PC(t.cut/t.req)} yêu cầu cắt · còn <b>${T(remain)}</b> t</div></div>
   <div class="step"><div class="t">Bàn giao</div><div class="v">${T(t.bg)} t</div><div class="d">${PC(t.bg/t.kl)} tổng KL · chờ bàn giao <b>${T(t.cut-t.bg>0?t.cut-t.bg:0)}</b> t</div></div>
  </div></section>

  <section><div class="sec-h"><h2>Cảnh báo cần xử lý</h2><p>${alerts.filter(a=>a.s==='bad').length} mức cao · ${alerts.filter(a=>a.s!=='bad').length} cần theo dõi · bấm tên dự án để xem chi tiết</p></div>
  <ul class="alerts">${alerts.slice(0,10).map(a=>`<li class="${a.s}"><span><a data-go="${a.p.id}">${esc(a.p.name)}</a> — ${esc(a.m)}</span></li>`).join('')}</ul></section>

  <section class="grid">
   <div class="card"><h3>Tiến độ cắt theo dự án (tấn)</h3>
    <div class="legend"><span><i class="c-cut"></i>Đã cắt</span><span><i class="c-rem"></i>Còn phải cắt</span></div>
    ${hbars(P.filter(p=>p.kl>=1).map(p=>({id:p.id,label:p.name,segs:[{v:p.cut,c:'c-cut',n:'Đã cắt'},{v:p.req-p.cut,c:'c-rem',n:'Còn phải cắt'}],right:`${T0(p.kl)} t · ${PC(p.pc)}`})),Math.max(...P.map(p=>p.req)),{click:1})}
    <p class="note">Bấm tên dự án để mở chi tiết. Ẩn các dự án dưới 1 tấn.</p></div>
   <div class="card"><h3>Đủ thép cho nesting chưa cắt? (tấn)</h3>
    <div class="legend"><span><i class="c-own"></i>Tồn dự án</span><span><i class="c-com"></i>Kho chung/BRAVO</span><span><i class="c-buy"></i>Phải mua</span></div>
    ${(()=>{const seen=new Set();const rows=P.filter(p=>p.kho&&p.kho.need>0.05&&!seen.has(p.kho.name)&&seen.add(p.kho.name)).sort((a,b)=>b.kho.need-a.kho.need);
      return hbars(rows.map(p=>({id:p.id,label:p.kho.shared.length?p.name+' (+'+p.kho.shared.length+')':p.name,segs:[{v:p.kho.own,c:'c-own',n:'Tồn dự án'},{v:p.kho.common,c:'c-com',n:'Kho chung/BRAVO'},{v:p.kho.buy,c:'c-buy',n:'Phải mua'}],right:p.kho.buy>0.05?`<span style="color:var(--bad)">thiếu ${T(p.kho.buy)}</span>`:'đủ'})),Math.max(...rows.map(p=>p.kho.need)),{click:1})})()}
    <p class="note">So theo độ dày (PL) hoặc quy cách hình. Dự án có file nesting (Hùng Vương, RMG, Shiplift) được đối chiếu chi tiết đến từng tấm, khổ và mác trong trang dự án; riêng nesting thiếu ${T(nesBuy)} t.</p></div>
  </section>

  <section class="grid">
   <div class="card"><h3>Sản lượng cắt và bàn giao theo tháng</h3>${cols([{n:'Cắt',v:D.m_cut,col:'--accent'},{n:'Bàn giao',v:D.m_bg,col:'--accent2'}],MLAB)}</div>
   <div class="card"><h3>Thiếu thép theo quy cách, toàn công ty (tấn)</h3>
    <div class="legend"><span><i class="c-own"></i>Tồn dự án</span><span><i class="c-com"></i>Kho chung/BRAVO</span><span><i class="c-buy"></i>Phải mua</span></div>
    ${hbars(D.bykey.filter(r=>r.buy>0.05).slice(0,12).map(r=>({label:r.k,segs:[{v:r.own,c:'c-own',n:'Tồn dự án'},{v:r.fc,c:'c-com',n:'Kho chung/BRAVO'},{v:r.buy,c:'c-buy',n:'Phải mua'}],right:`mua ${T(r.buy)}`})),Math.max(...D.bykey.map(r=>r.need)))}</div>
  </section>

  <section><div class="sec-h"><h2>Bảng sức khỏe dự án</h2><p>Bấm vào một dòng để xem chi tiết · bấm tiêu đề cột để sắp xếp</p></div>
  ${table('t-ov',[
    {h:'Dự án',f:p=>`<b>${esc(p.name)}</b><br><span style="color:var(--muted);font-size:11.5px">${esc(p.code||p.id)}</span>`,s:p=>p.name},
    {h:'Trạng thái',f:p=>{const x=health(p);return pill(x.c,x.t)},s:p=>health(p).c},
    {h:'KL (t)',n:1,f:p=>T(p.kl),s:p=>p.kl},
    {h:'% cắt',n:1,f:p=>`${PC(p.pc)}<span class="mini"><i style="width:${(p.pc||0)*100}%"></i></span>`,s:p=>p.pc??0},
    {h:'% bàn giao',n:1,f:p=>PC(p.pb),s:p=>p.pb??0},
    {h:'LSX xong / đang / chưa',n:1,f:p=>`${p.lsx_st['Đã cắt xong']||0} / ${p.lsx_st['Đang cắt']||0} / ${p.lsx_st['Chưa cắt']||0}`,s:p=>p.n_lsx},
    {h:'Phôi chờ cắt (t)',n:1,f:p=>p.kho?T(p.kho.need):'–',s:p=>p.kho?p.kho.need:-1},
    {h:'Thiếu thép (t)',n:1,f:p=>{const v=buyOf(p);return v==null?'<span style="color:var(--muted)">chưa map kho</span>':v>0.05?`<b style="color:var(--bad)">${T(v)}</b>`:'0,0'},s:p=>buyOf(p)??-1},
    {h:'Cắt gần nhất',f:p=>p.last_cut||'–',s:p=>p.last_cut||''},
    {h:'Dòng lỗi dữ liệu',n:1,f:p=>T0(p.err.reduce((a,e)=>a+e.n,0)),s:p=>p.err.reduce((a,e)=>a+e.n,0)},
  ],P.map(p=>({...p,_id:p.id})),{click:1})}
  <p class="note" style="font-size:12px;color:var(--muted)">Thiếu thép: dự án có file nesting lấy kết quả đối chiếu từng tấm (khổ + mác); dự án khác so theo độ dày. ${D.nomap.length} công trình chưa map sang dự án kho: ${D.nomap.map(esc).join(', ')}.</p></section>

  <section class="grid">
   <div class="card"><h3>Sản lượng đã cắt theo máy (tấn)</h3>${hbars(D.mach.slice(0,10).map(m=>({label:m.k,segs:[{v:m.t,c:'c-cut',n:'Đã cắt'}],right:T(m.t)})),D.mach[0].t)}</div>
   <div class="card"><h3>Lỗi dữ liệu trong file Cutting (số dòng)</h3>${hbars(D.err.map(e=>({label:e.c+' · '+e.d,segs:[{v:e.n,c:'c-neu',n:'Số dòng'}],right:T0(e.n)})),Math.max(...D.err.map(e=>e.n)))}
    <p class="note">E04 (ô ngày chứa chữ) và E10 (dòng trùng) chiếm phần lớn. Các lỗi này làm sai số liệu BCSL và % hoàn thành.</p></div>
  </section>`;
  $('v-ov').innerHTML=h; sortable($('v-ov'));
}

/* ---------- PROJECT ---------- */
function renderProject(id){
  const p=P.find(x=>x.id===id)||P[0]; const hs=health(p); const k=p.kho, n=p.nes;
  const nb=n&&n.alloc.find(a=>a.k==='Phải mua');
  let h=`<section><div class="ph"><div><h2 style="font-size:24px">${esc(p.name)}</h2>
   <div class="meta">${esc(p.id)}${k?` · Dự án kho: ${esc(k.name)}`:' · Chưa map sang dự án kho'}${n?` · Nesting: ${esc(n.file)}`:''}</div></div>${pill(hs.c,hs.t)}</div></section>
  <section><div class="kpis">
   ${kpi('Tổng KL lệnh',T(p.kl),'t',`${p.n_lsx} LSX`)}
   ${kpi('Đã cắt',PC(p.pc),'',`${T(p.cut)} / ${T(p.req)} t`,p.pc>=0.999?'good':'')}
   ${kpi('Đã bàn giao',PC(p.pb),'',`${T(p.bg)} t`)}
   ${kpi('Còn phải cắt',T(Math.max(0,p.req-p.cut)),'t',p.last_cut?`cắt gần nhất ${p.last_cut}`:'chưa cắt')}
   ${k?kpi('Phôi chờ cắt',T(k.need),'t',`tận dụng thêm ${T(k.tandung)} t`):''}
   ${n?kpi('Thiếu tấm (nesting)',T(nb?nb.t:0),'t',`${nb?nb.n:0} tấm không có trong kho`,nb&&nb.t>0?'bad':'good'):(k?kpi('Thiếu thép',T(k.buy),'t','so theo độ dày',k.buy>0.05?'bad':'good'):'')}
  </div></section>`;
  if(p.alerts.length) h+=`<section><ul class="alerts">${p.alerts.map(a=>`<li class="${a.s}"><span>${esc(a.m)}</span></li>`).join('')}</ul></section>`;
  // stages + months
  const stL={cut:'Cắt',khoan:'Khoan',chan:'Chấn / lốc',vat:'Vát mép'};
  h+=`<section class="grid"><div class="card"><h3>Tiến độ theo công đoạn</h3>
   ${Object.entries(p.stages).filter(([s,v])=>v.req>0).map(([s,v])=>`<div class="stage"><span>${stL[s]}</span><div class="track"><i class="c-cut" style="width:${Math.min(100,v.done/v.req*100)}%" data-tip="${stL[s]}: ${T(v.done)} / ${T(v.req)} t"></i></div><span class="num" style="font-size:12px;text-align:right">${T(v.done)} / ${T(v.req)} t</span></div>`).join('')}
   <div class="stage"><span>Bàn giao</span><div class="track"><i class="c-bg" style="width:${Math.min(100,(p.pb||0)*100)}%"></i></div><span class="num" style="font-size:12px;text-align:right">${T(p.bg)} / ${T(p.kl)} t</span></div>
   <h3 style="margin-top:16px">Trạng thái LSX</h3>
   ${seg100([{n:'Đã cắt xong',v:p.lsx_st['Đã cắt xong']||0,c:'c-own',fmt:T0},{n:'Đang cắt',v:p.lsx_st['Đang cắt']||0,c:'c-com',fmt:T0},{n:'Chưa cắt',v:p.lsx_st['Chưa cắt']||0,c:'c-neu',fmt:T0}])}
   ${p.mach.length?`<h3 style="margin-top:16px">Máy cắt (tấn đã cắt)</h3>${hbars(p.mach.map(m=>({label:m.k,segs:[{v:m.t,c:'c-cut',n:'Đã cắt'}],right:T(m.t)})),p.mach[0].t)}`:''}
  </div>
  <div class="card"><h3>Cắt và bàn giao theo tháng (tấn)</h3>${cols([{n:'Cắt',v:p.m_cut,col:'--accent'},{n:'Bàn giao',v:p.m_bg,col:'--accent2'}].concat(k?[{n:'Kho xuất thép',v:k.xuat_m,col:'--neutral'}]:[]),MLAB)}
   <p class="note">Kho xuất thép: tổng phiếu xuất kho của dự án kho theo tháng (đã sửa ngày bị đảo ngày/tháng).</p></div></section>`;
  // steel
  if(k){
    h+=`<section><div class="sec-h"><h2>Thép: kho so với nhu cầu</h2><p>${k.shared.length?`Dự án kho dùng chung với: ${k.shared.map(esc).join(', ')}`:'Nhu cầu = nesting chưa cắt trong Cutting, quy ra phôi nguyên khổ'}</p></div>
    <div class="grid"><div class="card"><h3>Nhập · xuất · tồn của dự án kho (tấn)</h3>
      ${seg100([{n:'Đã xuất',v:k.xuat,c:'c-cut'},{n:'Còn tồn',v:k.ton,c:'c-own'}])}
      <p class="note">Tổng nhập ${T(k.nhap)} t = xuất ${T(k.xuat)} + tồn ${T(k.ton)}.</p>
      <h3 style="margin-top:14px">Nhu cầu phôi chưa cắt ${T(k.need)} t được đáp ứng từ</h3>
      ${seg100([{n:'Tồn dự án',v:k.own,c:'c-own'},{n:'Kho chung/BRAVO',v:k.common,c:'c-com'},{n:'Phải mua',v:k.buy,c:'c-buy'}])}
      <h3 style="margin-top:14px">Tồn kho lớn nhất theo quy cách (tấn)</h3>
      ${hbars(k.ton_key.slice(0,8).map(r=>({label:r.k,segs:[{v:r.t,c:'c-own',n:'Tồn'}],right:T(r.t)})),k.ton_key.length?k.ton_key[0].t:1)}</div>
     <div class="card"><h3>Cân đối theo quy cách</h3>
      ${k.bal.length?table('t-bal',[
        {h:'Quy cách',f:r=>`<b>${esc(r.k)}</b>`,s:r=>r.k},{h:'Số nesting',n:1,f:r=>r.n,s:r=>r.n},{h:'Cần (t)',n:1,f:r=>T(r.need),s:r=>r.need},
        {h:'Tồn DA (t)',n:1,f:r=>T(r.own),s:r=>r.own},{h:'Kho chung',n:1,f:r=>T(r.fc),s:r=>r.fc},
        {h:'Phải mua',n:1,f:r=>r.buy>0.05?`<b style="color:var(--bad)">${T(r.buy)}</b>`:'0,0',s:r=>r.buy},
        {h:'',f:r=>r.buy>0.05?pill('bad','Thiếu'):r.fc>0.05?pill('warn','Bù Kho chung'):pill('good','Đủ'),s:r=>r.buy}],k.bal):'<p class="empty">Không còn nesting chờ cắt dùng thép nguyên khổ.</p>'}
     </div></div></section>`;
  }
  // nesting
  if(n){
    const f=n.flow, tin=f.new+f.rin;
    const blk=(lab,v,col)=>`<div class="blk" style="background:var(${col});flex:${Math.max(v,tin*0.035)} 0 0" data-tip="${lab}: ${T(v)} t (${PC(v/tin)})"><span>${lab}</span><span>${T(v)} t</span></div>`;
    h+=`<section><div class="sec-h"><h2>Nesting ${esc(n.file)}</h2><p>${T0(n.n_nesting)} nesting · ${n.n_lsx} LSX · đối chiếu với file Cutting theo số nesting</p></div>
    <div class="kpis">${kpi('Thành phẩm / thép vào',PC(n.pct.tp),'',`${T(f.tp)} t thành phẩm`)}${kpi('% Remain sinh ra',PC(n.pct.remain),'',`${T(f.rm)} t thu hồi lỡ cỡ`,n.pct.remain>0.3?'warn':'')}${kpi('% Phế liệu',PC(n.pct.phe),'',`${T(f.pl)} t`)}${kpi('Hao hụt (phế / TP)',PC(n.pct.hh),'','',n.pct.hh>0.08?'warn':'good')}</div>
    <div class="grid" style="margin-top:16px"><div class="card"><h3>Cân bằng vật tư (tấn)</h3>
      <div class="flow" style="height:230px"><div class="col"><div style="font-size:12px;color:var(--muted)">VÀO ${T(tin)} t</div>${blk('Tấm mới',f.new,'--accent')}${blk('Remain / tận dụng',f.rin,'--accent2')}</div>
      <div class="col"><div style="font-size:12px;color:var(--muted)">RA ${T(f.tp+f.rm+f.pl+f.th)} t</div>${blk('Thành phẩm',f.tp,'--good')}${blk('Remain thu hồi',f.rm,'--accent2')}${blk('Phế liệu',f.pl,'--warn')}${blk('Tiêu hao',f.th,'--bad')}</div></div>
      <h3 style="margin-top:14px">Tấm nesting đã vào Cutting chưa?</h3>
      ${seg100(['Đã cắt hết','Cắt dở','Chưa cắt','Chưa nạp Cutting'].map(s=>{const x=n.cut_st.find(c=>c.k===s);return{n:s,v:x?x.t:0,c:{'Đã cắt hết':'c-own','Cắt dở':'c-com','Chưa cắt':'c-neu','Chưa nạp Cutting':'c-buy'}[s]}}))}

      <p class="note">Ghép tấm: cùng độ dày, khổ lô ≥ khổ nesting, cùng nhóm mác (AS3678 chỉ nhận AS3678).</p></div>
     <div class="card"><h3>Tấm phải mua (top theo KL)</h3>

      <h3 style="margin-top:14px">LSX có trong nesting nhưng chưa nạp Cutting</h3>
      ${n.lsx_not_in_cut.length?table('t-miss',[{h:'LSX',f:r=>`<b>${esc(r.lsx)}</b>`,s:r=>r.lsx},{h:'KL tấm (t)',n:1,f:r=>T(r.t),s:r=>r.t}],n.lsx_not_in_cut):'<p class="empty">Không có.</p>'}
      ${n.lsx_cut_not_in_nes.length?`<p class="note">LSX trong Cutting nhưng không có trong file nesting này: ${n.lsx_cut_not_in_nes.map(esc).join(', ')} (thường là LSX thép hình TH hoặc file nesting khác).</p>`:''}
     </div></div>
     <div class="card" style="margin-top:16px"><h3>Theo độ dày tấm</h3>
      <div class="legend"><span><i class="c-own"></i>Thành phẩm</span><span><i class="c-bg"></i>Remain</span><span><i class="c-com"></i>Phế liệu</span></div>
      ${hbars(n.by_t.map(r=>({label:'PL'+String(r.t).replace('.',','),segs:[{v:r.tp,c:'c-own',n:'Thành phẩm'},{v:r.rm,c:'c-bg',n:'Remain'},{v:r.pl,c:'c-com',n:'Phế liệu'}],right:`${T(r.w)} t · ${r.n} nest.`})),Math.max(...n.by_t.map(r=>r.w)))}</div></section>`;
  }
  // LSX table
  h+=`<section><div class="sec-h"><h2>Lệnh sản xuất</h2><p id="lsx-cnt"></p></div>
   <div class="filters"><input type="search" id="lsx-q" placeholder="Tìm LSX, hạng mục…" aria-label="Tìm LSX">
   ${['Tất cả','Chưa cắt','Đang cắt','Đã cắt xong'].map((s,i)=>`<button class="chip" data-f="${s}" aria-pressed="${i===0}">${s}</button>`).join('')}</div>
   <div id="lsx-box"></div></section>`;
  if(p.err.length) h+=`<section><div class="sec-h"><h2>Lỗi dữ liệu của dự án</h2><p>Nguồn: file Cutting</p></div>
   ${table('t-err',[{h:'Mã',f:e=>`<b>${e.c}</b>`,s:e=>e.c},{h:'Mô tả',w:1,f:e=>esc(e.d),s:e=>e.d},{h:'Số dòng',n:1,f:e=>T0(e.n),s:e=>e.n},{h:'KL liên quan (t)',n:1,f:e=>T(e.t),s:e=>e.t}],p.err)}</section>`;
  $('v-pj').innerHTML=h; sortable($('v-pj'));
  let flt='Tất cả';
  const draw=()=>{const q=($('lsx-q').value||'').toLowerCase();
    const rows=p.lsx.filter(r=>(flt==='Tất cả'||r.st===flt)&&(!q||(r.lsx+' '+(r.hm||'')).toLowerCase().includes(q)));
    $('lsx-cnt').textContent=`${rows.length} / ${p.lsx.length} LSX · ${T(rows.reduce((a,r)=>a+(r.kl||0),0))} t`;
    $('lsx-box').innerHTML=table('t-lsx',[
      {h:'LSX',f:r=>`<b>${esc(r.lsx)}</b>`,s:r=>r.lsx},{h:'Hạng mục',w:1,f:r=>esc(r.hm||''),s:r=>r.hm||''},{h:'Ngày BH',f:r=>r.bh||'–',s:r=>r.bh||''},
      {h:'KL (t)',n:1,f:r=>T(r.kl),s:r=>r.kl},{h:'% cắt',n:1,f:r=>`${PC(r.pc)}<span class="mini"><i style="width:${(r.pc||0)*100}%"></i></span>`,s:r=>r.pc??-1},
      {h:'% bàn giao',n:1,f:r=>PC(r.pb),s:r=>r.pb??-1},{h:'Trạng thái',f:r=>stPill(r.st),s:r=>r.st},{h:'Cắt gần nhất',f:r=>r.last||'–',s:r=>r.last||''},{h:'Máy',f:r=>esc(r.may||''),s:r=>r.may||''}],rows);
    sortable($('lsx-box'));};
  $('lsx-q').addEventListener('input',draw);
  $('v-pj').querySelectorAll('.chip').forEach(c=>c.addEventListener('click',()=>{flt=c.dataset.f;$('v-pj').querySelectorAll('.chip').forEach(x=>x.setAttribute('aria-pressed',x===c));draw()}));
  draw();
}

/* ---------- DATA SOURCES ---------- */
function renderSrc(){
  $('v-src').innerHTML=`<section><div class="sec-h"><h2>Dữ liệu cần nạp để cập nhật báo cáo</h2><p>Bỏ file vào thư mục ngày trên máy, rồi nhắn “cập nhật”</p></div>
  <div class="src-list">
   <div class="card"><h3>1 · File Cutting (bắt buộc)</h3><p><b>DDC_SHIPYARD - KHGC - SC.xlsx</b></p><p>Sheet dùng: <code>List Chi Tiết</code>, <code>2-List Chi Tiết</code>, <code>LỆNH SX</code>, <code>KẾ HOẠCH</code>.</p><p>Cho ra: tiến độ cắt, khoan, chấn, vát, bàn giao; nesting chưa cắt; lỗi dữ liệu.</p><p>Lần này: <b>${esc(D.files.cutting)}</b></p></div>
   <div class="card"><h3>2 · File Tồn kho (bắt buộc)</h3><p><b>TỒN KHO dd.mm.xlsx</b></p><p>Sheet dùng: <code>TỔNG HỢP NHẬP</code>, <code>TỔNG THÉP XUẤT</code>, <code>TỔNG TỒN HIỆN TẠI</code>.</p><p>Cho ra: nhập, xuất, tồn theo dự án; Kho chung, BRAVO; cân đối đủ hoặc thiếu thép.</p><p>Lần này: <b>${esc(D.files.kho)}</b></p></div>
   <div class="card"><h3>3 · File Nesting từng dự án (nên có)</h3><p><b>VT-xx-TT-nnn.xlsx</b>, mỗi dự án một file, bản mới nhất.</p><p>Sheet dùng: <code>List chi tiet</code>, <code>Phieu vat tu</code>, <code>Hao hut vat tu</code>, <code>LSX-VT</code>.</p><p>Cho ra: cân bằng vật tư, % remain, % phế, hao hụt; đối chiếu từng tấm với kho (khổ, mác); LSX chưa nạp Cutting.</p><p>Lần này: <b>${D.files.nesting.map(esc).join(', ')}</b></p></div>
   <div class="card"><h3>4 · Cấu hình (sửa khi có dự án mới)</h3><p><b>00_CAU_HINH/MAP_VA_QUY_TAC.xlsx</b></p><p>Map công trình Cutting sang dự án kho, nhóm mác, thứ tự dùng Kho chung, tham số quy đổi.</p><p>Công trình chưa map: <b>${D.nomap.map(esc).join(', ')||'không'}</b></p></div>
  </div></section>
  <section><div class="sec-h"><h2>Cách tính chính</h2></div><div class="card" style="font-size:13px">
   <p><b>% cắt</b> = KL các dòng có ngày CUTTING / KL các dòng có đánh dấu “x” cắt. <b>% bàn giao</b> = KL có ngày bàn giao / tổng KL.</p>
   <p><b>Phôi chờ cắt</b>: nesting chưa có ngày cắt nào. Tấm quy theo QUY CÁCH VẬT TƯ (dày × rộng × dài × 7,85); thép hình theo chiều dài cây; còn lại KL chi tiết / 0,85.</p>
   <p><b>Thứ tự đáp ứng</b>: tồn của chính dự án → Kho chung + TỒN BRAVO → điều chuyển dự án khác (cần duyệt) → phải mua.</p>
   <p><b>Nesting</b>: Weight = thành phẩm + remain thu hồi + phế liệu + tiêu hao. % remain và % phế chia cho tổng thép vào; hao hụt = phế / thành phẩm.</p>
   <p><b>Cần anh xác nhận</b>: thép đã xuất ra xưởng nhưng chưa cắt; có được thay mác cho AS3678 không; dự án kho của A07N24DDCVT01, ADAMAS, Tàu H1033; có được dùng Kho chung trước khi mua không.</p>
  </div></section>
  <section><div class="sec-h"><h2>Tồn kho chưa gắn lệnh cắt</h2><p>Dự án có tồn nhưng không có trong file Cutting</p></div>
   ${hbars(D.kho_only.map(r=>({label:r.k,segs:[{v:r.t,c:'c-own',n:'Tồn'}],right:T(r.t)+' t'})),Math.max(1,...D.kho_only.map(r=>r.t)))}</section>`;
}

/* ---------- navigation ---------- */
const sel=$('proj');
sel.innerHTML=`<option value="">Tất cả dự án (tổng quan)</option>`+P.map(p=>`<option value="${esc(p.id)}">${esc(p.name)} · ${T0(p.kl)} t</option>`).join('');
let cur='';
function show(view,id){
  if(view==='pj'){cur=id||cur||P[0].id;sel.value=cur;renderProject(cur)}
  if(view==='ov')sel.value='';
  if(view==='src'&&!$('v-src').innerHTML)renderSrc();
  ['ov','pj','src'].forEach(v=>{$('v-'+v).hidden=v!==view;$('t-'+v).setAttribute('aria-pressed',v===view)});
  try{localStorage.setItem('chuoi-view',JSON.stringify({view,id:cur}))}catch(e){}
  window.scrollTo({top:0});
}
sel.addEventListener('change',()=>sel.value?show('pj',sel.value):show('ov'));
$('t-ov').onclick=()=>show('ov');$('t-pj').onclick=()=>show('pj');$('t-src').onclick=()=>show('src');
document.addEventListener('click',e=>{const g=e.target.closest('[data-go]');if(g)show('pj',g.dataset.go)});
document.addEventListener('keydown',e=>{if(e.key==='Enter'){const g=e.target.closest('[data-go]');if(g)show('pj',g.dataset.go)}});
const tip=$('tip');
document.addEventListener('mousemove',e=>{const t=e.target.closest('[data-tip]');if(!t){tip.style.display='none';return}
  tip.textContent=t.dataset.tip;tip.style.display='block';const x=Math.min(e.clientX+12,innerWidth-tip.offsetWidth-8);tip.style.left=x+'px';tip.style.top=(e.clientY+14)+'px'});
$('asof').textContent=`Số liệu ngày ${D.date.split('-').reverse().join('/')} · Cutting + Tồn kho + ${D.files.nesting.length} file Nesting`;
renderOverview();
try{const s=JSON.parse(localStorage.getItem('chuoi-view')||'null');if(s&&s.view==='pj'&&P.some(p=>p.id===s.id))show('pj',s.id)}catch(e){}
</script>
