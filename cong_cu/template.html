<title>Chuỗi Thép Sơ Chế Vũng Tàu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: dark-red vertical rail (views + project list) | work area with red header band, KPI strip, chart grid, detail tables.
   Red = brand chrome and key figures. Data marks: slate (done) / light (remaining); semantic green/amber/red only for sufficiency and status. */
:root{
  --bg:#f4f2f1; --panel:#ffffff; --ink:#1f1a1a; --muted:#6b6262; --line:#e2dcdb; --soft:#efeae9;
  --brand:#b3261e; --brand-d:#7a1712; --brand-dd:#5a100c; --brand-soft:#fbe9e7; --on-brand:#ffffff; --rail-ink:#f6dcd9;
  --d1:#3b4a54; --d2:#9fb0ba; --d3:#c9d3d9;
  --good:#2e7d4f; --warn:#c07a12; --bad:#d32f2f; --neutral:#a59c9b;
  --good-bg:#e6f3ea; --warn-bg:#fbf0dc; --bad-bg:#fde4e1;
  --s0:#c62828; --s1:#e08a1e; --s2:#1f8a8a; --s3:#2e8b57; --s4:#3d5a80; --s5:#7b61b8; --s6:#8d8580;
  --f-disp:"IBM Plex Sans Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"IBM Plex Sans",Arial,sans-serif;
  --f-mono:"IBM Plex Mono",Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#151112; --panel:#1f1a1b; --ink:#efe8e7; --muted:#a89b9a; --line:#352d2e; --soft:#29221f;
  --brand:#e5534b; --brand-d:#5c1511; --brand-dd:#420e0b; --brand-soft:#3a1a18; --on-brand:#ffffff; --rail-ink:#f2cfcb;
  --d1:#a9bcc8; --d2:#5d707c; --d3:#3b4850;
  --good:#5fb783; --warn:#e0a84a; --bad:#ff6b5e; --neutral:#6e6363;
  --good-bg:#1c3226; --warn-bg:#3a2e17; --bad-bg:#40201d; --s0:#ef5350; --s1:#f0a33c; --s2:#3fb3b3; --s3:#56b87e; --s4:#7ea3cf; --s5:#a08ae0; --s6:#a49b96; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#151112; --panel:#1f1a1b; --ink:#efe8e7; --muted:#a89b9a; --line:#352d2e; --soft:#29221f;
  --brand:#e5534b; --brand-d:#5c1511; --brand-dd:#420e0b; --brand-soft:#3a1a18; --on-brand:#ffffff; --rail-ink:#f2cfcb;
  --d1:#a9bcc8; --d2:#5d707c; --d3:#3b4850;
  --good:#5fb783; --warn:#e0a84a; --bad:#ff6b5e; --neutral:#6e6363;
  --good-bg:#1c3226; --warn-bg:#3a2e17; --bad-bg:#40201d; --s0:#ef5350; --s1:#f0a33c; --s2:#3fb3b3; --s3:#56b87e; --s4:#7ea3cf; --s5:#a08ae0; --s6:#a49b96; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.5 var(--f-body);margin:0}
h1,h2,h3{font-family:var(--f-disp);margin:0;text-wrap:balance;letter-spacing:.01em}
h2{font-size:19px;font-weight:600}
h3{font-size:12.5px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.num,td.n{font-variant-numeric:tabular-nums;font-family:var(--f-mono)}
a{color:var(--brand)}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}

/* ---------- app shell ---------- */
.app{display:grid;grid-template-columns:264px minmax(0,1fr);min-height:100%}
.rail{background:linear-gradient(180deg,var(--brand-d),var(--brand-dd));color:var(--rail-ink);position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column;gap:14px;padding:18px 12px 24px}
.logo{padding:2px 8px 12px;border-bottom:1px solid rgba(255,255,255,.14)}
.logo b{display:block;font:700 19px/1.2 var(--f-disp);color:var(--on-brand);letter-spacing:.02em}
.logo span{font-size:12px;opacity:.85}
.rail h4{margin:4px 8px 2px;font:600 11px var(--f-disp);letter-spacing:.12em;text-transform:uppercase;opacity:.7}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{all:unset;cursor:pointer;display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:7px;color:var(--rail-ink);font-weight:500;font-size:14px}
.nav button svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8}
.nav button:hover{background:rgba(255,255,255,.08)}
.nav button[aria-current=true]{background:var(--on-brand);color:var(--brand-d);font-weight:600}
.nav button .cnt{margin-left:auto;font:11px var(--f-mono);background:rgba(255,255,255,.16);padding:1px 7px;border-radius:9px}
.nav button[aria-current=true] .cnt{background:var(--brand-soft);color:var(--brand)}
.plist{display:flex;flex-direction:column;gap:1px}
.plist button{all:unset;cursor:pointer;display:grid;grid-template-columns:8px minmax(0,1fr) auto;gap:4px 8px;align-items:center;padding:7px 10px;border-radius:7px;color:var(--rail-ink);font-size:13px}
.plist button:hover{background:rgba(255,255,255,.08)}
.plist button[aria-current=true]{background:var(--on-brand);color:var(--brand-d)}
.plist .dot{width:8px;height:8px;border-radius:50%}
.plist .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.plist .pc{font:11px var(--f-mono);opacity:.85}
.plist .bar{grid-column:2/4;height:3px;background:rgba(255,255,255,.18);border-radius:2px;overflow:hidden}
.plist .bar i{display:block;height:100%;background:var(--on-brand)}
.plist button[aria-current=true] .bar{background:var(--brand-soft)} .plist button[aria-current=true] .bar i{background:var(--brand)}
.dot-good{background:#7ddc9e}.dot-warn{background:#ffc862}.dot-bad{background:#ff8a80}
.rail .foot{margin-top:auto;font-size:11.5px;opacity:.75;padding:0 8px}
.rail .foot a{color:var(--on-brand)}
.menu-btn{display:none}
.collapse{display:flex;flex-direction:column;gap:14px}

.main{min-width:0}
.band{background:var(--panel);border-bottom:3px solid var(--brand);position:sticky;top:0;z-index:10}
.band .in{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between;padding:12px 24px}
.band h1{font-size:22px;font-weight:700}
.band h1 small{display:block;font:500 12.5px var(--f-body);color:var(--muted)}
.crumb{font:600 11.5px var(--f-disp);letter-spacing:.1em;text-transform:uppercase;color:var(--brand)}
.band .right{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chip-date{background:var(--brand);color:var(--on-brand);font:600 12.5px var(--f-mono);padding:5px 10px;border-radius:6px}
.content{padding:4px 24px 48px;max-width:1400px}
section{margin-top:22px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:10px;border-left:4px solid var(--brand);padding-left:10px}
.sec-h p{margin:0;color:var(--muted);font-size:12.5px}
select,button.b,input[type=search]{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:7px 10px}
button.b{cursor:pointer}

/* ---------- blocks ---------- */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.kpi{background:var(--panel);border:1px solid var(--line);border-top:3px solid var(--brand);border-radius:8px;padding:12px 14px;min-width:0}
.kpi .l{font-size:12px;color:var(--muted)}
.kpi .v{font:700 26px/1.2 var(--f-disp);font-variant-numeric:tabular-nums;margin-top:2px;color:var(--brand)}
.kpi .v small{font-size:13px;font-weight:500;color:var(--muted);margin-left:3px}
.kpi .s{font-size:12px;color:var(--muted)}
.kpi .m{height:5px;background:var(--soft);border-radius:3px;margin-top:8px;overflow:hidden}
.kpi .m i{display:block;height:100%;background:var(--brand)}
.kpi.good{border-top-color:var(--good)} .kpi.good .v{color:var(--good)}
.kpi.bad{border-top-color:var(--bad)} .kpi.bad .v{color:var(--bad)}
.kpi.dim{border-top-color:var(--d1)} .kpi.dim .v{color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,480px),1fr));gap:16px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px 16px;min-width:0}
.card h3{margin-bottom:10px}
.note{font-size:12px;color:var(--muted);margin:8px 0 0}
.chain{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1px solid var(--line);border-radius:8px;background:var(--panel);overflow:hidden}
.step{padding:14px 16px;position:relative;min-width:0;border-right:1px solid var(--line)}
.step:last-child{border-right:0}
.step:not(:last-child)::after{content:"";position:absolute;right:-8px;top:50%;width:14px;height:14px;background:var(--panel);border-top:1px solid var(--line);border-right:1px solid var(--line);transform:translateY(-50%) rotate(45deg);z-index:1}
.step .t{font:600 12px var(--f-disp);letter-spacing:.1em;text-transform:uppercase;color:var(--brand)}
.step .v{font:700 23px/1.25 var(--f-disp);font-variant-numeric:tabular-nums}
.step .d{font-size:12px;color:var(--muted)} .step .d b{color:var(--ink);font-weight:600}
.hb{display:grid;grid-template-columns:minmax(90px,180px) minmax(0,1fr) auto;gap:6px 10px;align-items:center;font-size:13px}
.hb .lab{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb .lab.click{cursor:pointer;color:var(--brand);font-weight:500}
.hb .lab.click:hover{text-decoration:underline}
.track{height:18px;background:var(--soft);border-radius:3px;display:flex;overflow:hidden;min-width:0}
.track i{display:flex;align-items:center;justify-content:center;height:100%;overflow:hidden;min-width:0}
.track i .sv{font:600 10.5px var(--f-mono);color:#fff;white-space:nowrap;padding:0 3px;text-shadow:0 0 2px rgba(0,0,0,.35);pointer-events:none}
.track i.c-rem .sv,.track i.c-bg .sv,.track i.c-neu .sv{color:var(--ink);text-shadow:none}
.hb .val{font:12px var(--f-mono);font-variant-numeric:tabular-nums;color:var(--muted);text-align:right;white-space:nowrap}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--muted);margin-bottom:8px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:10px;height:10px;border-radius:2px;display:inline-block}
.c-cut{background:var(--d1)} .c-rem{background:var(--soft);box-shadow:inset 0 0 0 1px var(--line)} .c-bg{background:var(--d2)}
.c-own{background:var(--good)} .c-com{background:var(--warn)} .c-buy{background:var(--bad)} .c-neu{background:var(--neutral)} .c-br{background:var(--brand)}
svg text{fill:var(--muted);font:11px var(--f-mono)}
svg text.vl{fill:var(--ink);font:600 10px var(--f-mono)}
.ii{display:inline-grid;place-items:center;width:15px;height:15px;border-radius:50%;border:1px solid var(--muted);color:var(--muted);font:italic 700 10px/1 Georgia,serif;margin-left:6px;cursor:help;vertical-align:1px;text-transform:none;letter-spacing:0}
.ii:hover,.ii:focus{border-color:var(--brand);color:var(--brand)}
.sub{font-weight:400;text-transform:none;letter-spacing:0;color:var(--muted);font-size:12px}
svg .grid-l{stroke:var(--line);stroke-width:1} svg .axis{stroke:var(--muted);stroke-width:1}
.tbl-wrap{overflow:auto;border:1px solid var(--line);border-radius:8px;background:var(--panel);max-height:560px}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{font:600 12px var(--f-disp);letter-spacing:.03em;color:var(--on-brand);background:var(--brand-d);position:sticky;top:0;cursor:pointer;user-select:none;z-index:1}
th.n,td.n{text-align:right}
tbody tr:nth-child(even){background:color-mix(in srgb,var(--soft) 45%,transparent)}
tbody tr:hover{background:var(--brand-soft)}
tr.click{cursor:pointer}
td.wrapc{white-space:normal;min-width:220px}
tfoot td{font-weight:600;background:var(--soft)}
.mini{display:inline-block;width:64px;height:6px;background:var(--soft);border-radius:3px;vertical-align:middle;margin-left:6px;overflow:hidden}
.mini i{display:block;height:100%;background:var(--d1)}
.pill{display:inline-block;padding:1px 8px;border-radius:10px;font-size:11.5px;font-weight:600;white-space:nowrap}
.p-good{background:var(--good-bg);color:var(--good)} .p-warn{background:var(--warn-bg);color:var(--warn)} .p-bad{background:var(--bad-bg);color:var(--bad)} .p-neu{background:var(--soft);color:var(--muted)}
.alerts{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.alerts li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:center;background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--warn);border-radius:6px;padding:8px 12px;font-size:13px}
.alerts li.bad{border-left-color:var(--bad)}
.alerts li a{cursor:pointer;font-weight:600}
.pcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.pcard{all:unset;cursor:pointer;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 14px;display:grid;grid-template-columns:62px minmax(0,1fr);gap:4px 12px;align-items:center;min-width:0}
.pcard:hover{border-color:var(--brand);box-shadow:0 2px 10px color-mix(in srgb,var(--brand) 18%,transparent)}
.pcard .nm{font:600 15px/1.25 var(--f-disp);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pcard .meta{font-size:12px;color:var(--muted)}
.pcard .row{grid-column:1/3;display:flex;justify-content:space-between;gap:6px;flex-wrap:wrap;font-size:12px;border-top:1px dashed var(--line);padding-top:6px;margin-top:4px}
.ring text{font:700 13px var(--f-disp);fill:var(--ink)}
.stage{display:grid;grid-template-columns:100px minmax(0,1fr) auto;gap:10px;align-items:center;font-size:13px;margin:6px 0}
.stage .track{height:12px}
.stage .num{font-size:12px;text-align:right;white-space:nowrap}
.hc{display:inline-block;min-width:52px;padding:1px 6px;border-radius:4px}
details.grp{margin-bottom:10px}details.grp summary{cursor:pointer;padding:6px 2px;font-size:13.5px}
.filters input[type=search]{min-width:200px}
.stage>span:last-child{white-space:nowrap;font-size:12px}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:8px}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:14px;padding:3px 10px;font-size:12px;cursor:pointer;color:var(--ink)}
.chip[aria-pressed=true]{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.empty{color:var(--muted);font-size:13px;padding:10px 0}
.flow{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.flow .col{display:flex;flex-direction:column;gap:4px}
.flow .blk{display:flex;justify-content:space-between;gap:8px;padding:6px 10px;border-radius:4px;font-size:12.5px;color:#fff;min-height:28px;align-items:center}
.flow .blk span:last-child{font-family:var(--f-mono)}
.heat td.h{text-align:right;font-family:var(--f-mono)}
.src-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:12px}
.src-list .card p{margin:4px 0;font-size:13px}
code{font-family:var(--f-mono);font-size:12px;background:var(--soft);padding:1px 5px;border-radius:3px}
#tip{position:fixed;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12px;padding:6px 9px;border-radius:5px;max-width:300px;z-index:50;display:none;white-space:pre-line}


/* ---------- period report ---------- */
.fbar{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:8px;margin-top:16px}
.frow{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center}
.flab{font:600 11px var(--f-disp);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-left:6px}
.frow .flab:first-child{margin-left:0}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.seg button{all:unset;cursor:pointer;padding:4px 12px;font-size:12.5px;color:var(--ink);border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed=true]{background:var(--brand);color:var(--on-brand);font-weight:600}
input[type=date]{font:13px var(--f-mono);color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:4px 6px}
.fsum{margin-left:auto;font-size:12px;color:var(--muted)}
.chip.xoa{color:var(--brand);border-color:var(--brand)}
.chip .sw{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.chip[aria-pressed=true] .sw{box-shadow:0 0 0 1.5px var(--on-brand)}
.attn{margin-top:10px;background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--brand);border-radius:6px;padding:8px 12px;font-size:13px}
.attn b:first-child{color:var(--brand);margin-right:8px}
.kpis.k6{grid-template-columns:repeat(auto-fit,minmax(165px,1fr))}
.kpi.s0{border-top-color:var(--s0)}.kpi.s0 .v{color:var(--s0)}.kpi.s1{border-top-color:var(--s1)}.kpi.s1 .v{color:var(--s1)}.kpi.s2{border-top-color:var(--s2)}.kpi.s2 .v{color:var(--s2)}
.kpi.s3{border-top-color:var(--s3)}.kpi.s3 .v{color:var(--s3)}.kpi.s4{border-top-color:var(--s4)}.kpi.s4 .v{color:var(--s4)}.kpi.s5{border-top-color:var(--s5)}.kpi.s5 .v{color:var(--s5)}.kpi.s6{border-top-color:var(--s6)}.kpi.s6 .v{color:var(--s6)}
.kpi .s{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.dl{font:600 11.5px var(--f-mono)} .dl.up,.up{color:var(--good)} .dl.dn,.dn{color:var(--bad)}
.badge{font-size:11px;font-weight:600;padding:1px 7px;border-radius:9px;margin-left:auto}
.badge.ok{background:var(--good-bg);color:var(--good)} .badge.no{background:var(--bad-bg);color:var(--bad)}
.muted{color:var(--muted)}
.tgt{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 14px}
.tg-h{display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px 16px;font-size:13px}
.tg-h a{cursor:pointer}
.tg-bar{position:relative;height:8px;background:var(--soft);border-radius:4px;margin-top:8px}
.tg-bar i{display:block;height:100%;border-radius:4px;background:var(--good)}
.tg-bar em{position:absolute;top:-4px;width:2px;height:16px;background:var(--ink);opacity:.6}
.ins ul{margin:6px 0 0;padding-left:18px;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:4px 28px;font-size:13px}
.ins li::marker{color:var(--brand)}
.g21{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:16px}
.g12{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.5fr);gap:16px}
.tmark{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);opacity:.7}
.donut{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center}
.dleg{display:flex;flex-direction:column;gap:3px;font-size:12px;min-width:0}
.dleg span{display:flex;gap:6px;align-items:center}.dleg i{width:10px;height:10px;border-radius:2px;flex:none}
.hdr-btn{all:unset;cursor:pointer;font-size:12.5px;border:1px solid var(--line);border-radius:6px;padding:4px 10px;color:var(--ink)}
.hdr-btn:hover{border-color:var(--brand)}
@media (max-width:1100px){.g21,.g12{grid-template-columns:minmax(0,1fr)}}
@media print{.rail,.fbar .frow:first-child,.hdr-btn{display:none!important}.app{display:block}.band{position:static}.card,.kpi{break-inside:avoid}}


.opt-h{display:flex;gap:12px;align-items:flex-start;margin:6px 0 10px}
.opt-code{flex:none;width:30px;height:30px;border-radius:7px;background:var(--brand);color:var(--on-brand);display:grid;place-items:center;font:700 16px var(--f-disp)}
.intro{border-left:4px solid var(--brand);font-size:13.5px}
.cellbar{display:flex;height:20px;border-radius:3px;overflow:hidden;min-width:60px;background:var(--soft)}
.cellbar.full{width:100%}
.cellbar i{display:flex;align-items:center;justify-content:center;color:#fff;font:600 10.5px var(--f-mono);font-style:normal;white-space:nowrap;overflow:hidden}
td .cellbar{width:220px}

<script>
const D=/*DATA*/null;
const P=D.projects;
const TODAY=new Date(D.date+'T00:00:00');
const nf1=new Intl.NumberFormat('vi-VN',{maximumFractionDigits:1,minimumFractionDigits:1});
const nf0=new Intl.NumberFormat('vi-VN',{maximumFractionDigits:0});
const T=v=>v==null?'–':nf1.format(v), T0=v=>v==null?'–':nf0.format(v);
const PC=v=>v==null?'–':nf1.format(v*100)+'%';
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $=id=>document.getElementById(id);
const MLAB=D.months.map(m=>{const[y,mm]=m.split('-');return 'T'+(+mm)+'/'+y.slice(2)});
const sum=(a,f)=>a.reduce((s,x)=>s+(f(x)||0),0);
const days=d=>d?Math.round((TODAY-new Date(d+'T00:00:00'))/864e5):null;

/* ---------- derived ---------- */
function health(p){
  const bad=p.alerts.some(a=>a.s==='bad');
  if((p.pc??1)>=0.999&&!bad) return {c:'good',t:'Đã cắt xong'};
  if(bad) return {c:'bad',t:'Rủi ro thép/LSX'};
  if(p.alerts.length) return {c:'warn',t:'Theo dõi'};
  return {c:'good',t:'Đúng tiến độ'};
}
const buyOf=p=>{if(p.nes){const nb=p.nes.alloc.find(a=>a.k==='Phải mua');return nb?nb.t:0}return p.kho?p.kho.buy:null};
const openLsx=[]; P.forEach(p=>p.lsx.forEach(l=>{if((l.pc??0)<0.999&&l.kl>0){openLsx.push({...l,p,age:days(l.bh),rem:l.kl*(1-(l.pc||0))})}}));
const BUCK=[['≤ 7 ngày',0,7],['8–14 ngày',8,14],['15–30 ngày',15,30],['31–60 ngày',31,60],['> 60 ngày',61,1e9]];
const bucketOf=a=>a==null?null:BUCK.findIndex(b=>a>=b[1]&&a<=b[2]);
const kprojs=(()=>{const seen=new Set();return P.filter(p=>p.kho&&!seen.has(p.kho.name)&&seen.add(p.kho.name))})();

/* ---------- chart helpers ---------- */
function hbars(rows,max,{click}={}){
  return `<div class="hb">${rows.map(r=>{
    const segs=r.segs.map(s=>{const w=max?Math.max(0,s.v)/max*100:0;const lb=s.fmt?s.fmt(s.v):vlab(s.v);const show=w>=(MOB?16:Math.max(6,String(lb).length*1.25));return w>0?`<i class="${s.c}" style="width:${w}%" data-tip="${esc(r.label)}\n${esc(s.n)}: ${s.fmt?s.fmt(s.v):T(s.v)+' t'}">${show?`<b class="sv">${lb}</b>`:''}</i>`:''}).join('');
    return `<div class="lab${click&&r.id?' click':''}" ${click&&r.id?`data-go="${esc(r.id)}" role="button" tabindex="0"`:''} title="${esc(r.label)}">${esc(r.label)}</div><div class="track">${segs}</div><div class="val">${r.right??''}</div>`}).join('')}</div>`;
}
const MOB=matchMedia('(max-width:640px)').matches;
const svgW=(W)=>MOB?`width="${W}" style="max-width:none;display:block"`:'width="100%"';
const svgB=(W,h)=>MOB?svgW(W):`width="100%" height="${h}" preserveAspectRatio="xMidYMid meet" style="display:block"`;
const vlab=v=>v>=100?T0(v):v>=10?nf1.format(Math.round(v*10)/10):nf1.format(v);
const info=s=>`<span class="ii" tabindex="0" data-tip="${esc(s)}">i</span>`;
function nice(max){if(max<=0)return[1,[0,1]];const p=Math.pow(10,Math.floor(Math.log10(max)));const st=[1,2,2.5,5,10].map(k=>k*p).find(s=>max/s<=5);const top=Math.ceil(max/st)*st;const t=[];for(let v=0;v<=top+1e-9;v+=st)t.push(v);return[top,t]}
function cols(series,labels,{h=230,line=null,W:W0=680}={}){
  const W=MOB?Math.max(380,labels.length*series.length*20+70):W0,L=48,R=line?52:8,Tp=12,B=26,n=labels.length,gw=(W-L-R)/n,k=series.length,bw=Math.min(22,(gw-8)/k);
  const mx=Math.max(0,...series.flatMap(s=>s.v))*1.12;const[top,ticks]=nice(mx);const y=v=>Tp+(h-Tp-B)*(1-v/top);const rot=bw<26;
  let g=ticks.map(t=>`<line class="grid-l" x1="${L}" x2="${W-R}" y1="${y(t)}" y2="${y(t)}"/><text x="${L-6}" y="${y(t)+4}" text-anchor="end">${T0(t)}</text>`).join('');
  labels.forEach((lb,i)=>{const x0=L+i*gw+(gw-bw*k)/2;
    series.forEach((s,j)=>{const v=s.v[i]||0;const yy=y(v);g+=`<rect x="${x0+j*bw}" y="${yy}" width="${bw-2}" height="${Math.max(0,h-B-yy)}" rx="1.5" style="fill:var(${s.col})" data-tip="${lb}\n${s.n}: ${T(v)} t"></rect>`;
      if(v>0){const cx=x0+j*bw+bw/2-1;g+=rot?`<text class="vl" transform="translate(${cx+3.5},${yy-4}) rotate(-90)" text-anchor="start">${vlab(v)}</text>`:`<text class="vl" x="${cx}" y="${yy-4}" text-anchor="middle">${vlab(v)}</text>`}});
    g+=`<text x="${L+i*gw+gw/2}" y="${h-8}" text-anchor="middle">${lb}</text>`});
  if(line){const lm=Math.max(...line.v)||1;const[lt,lticks]=nice(lm);const yl=v=>Tp+(h-Tp-B)*(1-v/lt);
    const pts=line.v.map((v,i)=>`${L+i*gw+gw/2},${yl(v)}`).join(' ');
    g+=`<polyline points="${pts}" fill="none" style="stroke:var(${line.col})" stroke-width="2.2"/>`+line.v.map((v,i)=>`<circle cx="${L+i*gw+gw/2}" cy="${yl(v)}" r="${i===line.v.length-1?4:2.6}" style="fill:var(${line.col})" data-tip="${labels[i]}\n${line.n}: ${T(v)} t"/>`).join('')
      +lticks.map(t=>`<text x="${W-R+6}" y="${yl(t)+4}">${T0(t)}</text>`).join('');}
  g+=`<line class="axis" x1="${L}" x2="${W-R}" y1="${h-B}" y2="${h-B}"/>`;
  const leg=series.map(s=>`<span><i style="background:var(${s.col})"></i>${s.n}</span>`).join('')+(line?`<span><i style="background:var(${line.col});height:3px"></i>${line.n} (trục phải)</span>`:'');
  return `<div class="legend">${leg}</div><div class="chart-x${MOB&&W>400?' hint':''}"><svg viewBox="0 0 ${W} ${h}" ${svgB(W,h)} role="img" aria-label="Biểu đồ theo tháng">${g}</svg></div>`;
}
function ring(v,size=58,col='--brand'){const r=size/2-6,c=2*Math.PI*r,f=Math.max(0,Math.min(1,v||0));
  return `<svg class="ring" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" role="img" aria-label="${PC(v)}"><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" style="stroke:var(--soft)" stroke-width="7"/><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" style="stroke:var(${col})" stroke-width="7" stroke-linecap="round" stroke-dasharray="${c*f} ${c}" transform="rotate(-90 ${size/2} ${size/2})"/><text x="50%" y="54%" text-anchor="middle" dominant-baseline="middle">${v==null?'–':Math.round(f*100)+'%'}</text></svg>`}
function seg100(parts){const tot=parts.reduce((a,b)=>a+b.v,0)||1;
  return `<div class="track" style="height:24px">${parts.map(p=>p.v>0?`<i class="${p.c}" style="width:${p.v/tot*100}%" data-tip="${esc(p.n)}: ${p.fmt?p.fmt(p.v):T(p.v)} (${PC(p.v/tot)})">${p.v/tot>=(MOB?0.16:0.07)?`<b class="sv">${p.fmt?p.fmt(p.v):T(p.v)} · ${Math.round(p.v/tot*100)}%</b>`:''}</i>`:'').join('')}</div>
  <div class="legend" style="margin-top:6px">${parts.map(p=>`<span><i class="${p.c}"></i>${esc(p.n)}: <b class="num" style="color:var(--ink)">${p.fmt?p.fmt(p.v):T(p.v)}</b></span>`).join('')}</div>`}
function kpi(l,v,u,s,cls='',bar=null){return `<div class="kpi ${cls}"><div class="l">${l}</div><div class="v">${v}${u?`<small>${u}</small>`:''}</div>${s?`<div class="s">${s}</div>`:''}${bar!=null?`<div class="m"><i style="width:${Math.min(100,bar*100)}%"></i></div>`:''}</div>`}
function table(id,cols,rows,{click,foot}={}){
  return `<div class="tbl-wrap"><table id="${id}"><thead><tr>${cols.map((c,i)=>`<th class="${c.n?'n':''}" data-i="${i}" title="Bấm để sắp xếp">${c.h}</th>`).join('')}</tr></thead><tbody>${
    rows.map(r=>`<tr ${click&&r._id?`class="click" data-go="${esc(r._id)}"`:''}>${cols.map(c=>`<td class="${c.n?'n':''} ${c.w?'wrapc':''}" data-s="${esc(c.s?c.s(r):'')}">${c.f(r)}</td>`).join('')}</tr>`).join('')}</tbody>${foot?`<tfoot><tr>${foot.map((f,i)=>`<td class="${cols[i]&&cols[i].n?'n':''}">${f}</td>`).join('')}</tr></tfoot>`:''}</table></div>`}
function sortable(root){root.querySelectorAll('th').forEach(th=>th.addEventListener('click',()=>{
  const tb=th.closest('table').tBodies[0],i=+th.dataset.i,asc=th.dataset.o!=='a';th.dataset.o=asc?'a':'d';
  [...tb.rows].sort((a,b)=>{const x=a.cells[i].dataset.s,y=b.cells[i].dataset.s;const nx=parseFloat(x),ny=parseFloat(y);
    const r=(!isNaN(nx)&&!isNaN(ny))?nx-ny:x.localeCompare(y,'vi');return asc?r:-r}).forEach(r=>tb.appendChild(r))}))}
const pill=(c,t)=>`<span class="pill p-${c}">${esc(t)}</span>`;
const stPill=s=>pill(s==='Đã cắt xong'||s==='Đã cắt hết'?'good':s==='Đang cắt'||s==='Cắt dở'?'warn':s==='Chưa nạp Cutting'?'bad':'neu',s);
const ageCell=a=>a==null?'–':`<span style="color:${a>30?'var(--bad)':a>14?'var(--warn)':'var(--ink)'};font-weight:${a>30?600:400}">${a} ngày</span>`;
const secH=(t,p)=>`<div class="sec-h"><h2>${t}</h2>${p?`<p>${p}</p>`:''}</div>`;

/* ---------- biểu đồ dùng chung: Tổng quan + Chi tiết dự án ---------- */
/* cột tổng quát: mode 'stack' (xếp chồng tấn), 'pct' (xếp chồng 100%), 'group' (cột cạnh nhau) */
function colChart(cats,series,{mode='group',h=320,W=null,unit='t',fmt=null,ref=[],top=null,sub=null,go=null}={}){
  const flat=cats.every(c=>c.length<=16)&&cats.length<=8;
  const pc=Math.max(mode==='group'?series.length*26:58,flat?Math.max(...cats.map(c=>c.length))*7.6+10:0,sub&&mode!=='group'?Math.max(...cats.map((_,i)=>String(sub(i)).length))*6.8:0);
  W=W||(MOB?Math.max(360,cats.length*pc+90):Math.max(560,Math.min(980,cats.length*(mode==='group'?series.length*34+24:70)+120)));
  const L=50,R=flat?14:60,Tp=30,B=flat?(sub&&mode==='pct'?30:30):92,n=cats.length,gw=(W-L-R)/n,k=series.length;
  const bw=mode==='group'?Math.min(30,(gw-10)/k):Math.min(56,gw*0.64);
  const tot=cats.map((_,i)=>sum(series,s=>s.v[i]||0));
  const vmax=mode==='pct'?1:mode==='stack'?Math.max(1e-9,...tot):Math.max(1e-9,...series.flatMap(s=>s.v),...ref.map(r=>r.v));
  const pctAx=mode==='pct'||unit==='%';
  const rotS=mode!=='group'&&cats.some((_,i)=>String(sub?sub(i):'').length*6.6>gw-2);const[tp,ticks]=pctAx?[top||1,[0,.25,.5,.75,1].filter(t=>t<=(top||1)+1e-9)]:nice((top||vmax)*(rotS?1.45:1.16));const Tq=rotS&&pctAx?Tp+60:Tp;const y=v=>Tq+(h-Tq-B)*(1-v/tp);
  const f=fmt||(pctAx?(v=>Math.round(v*100)+'%'):vlab);
  let s=ticks.map(t=>`<line class="grid-l" x1="${L}" x2="${W-R}" y1="${y(t)}" y2="${y(t)}"/><text x="${L-6}" y="${y(t)+4}" text-anchor="end">${pctAx?Math.round(t*100)+'%':T0(t)}</text>`).join('');
  cats.forEach((c,i)=>{const cx=L+i*gw+gw/2;
    if(mode==='group'){const x0=cx-bw*k/2;series.forEach((se,j)=>{const v=se.v[i]||0,yy=y(v);if(v<=0)return;
        s+=`<rect x="${x0+j*bw}" y="${yy}" width="${bw-2}" height="${h-B-yy}" rx="1.5" style="fill:var(${se.c})" data-tip="${esc(c)}\n${se.n}: ${unit==='%'?PC(v):T(v)+' '+unit}"/>`;
        s+=bw>=26?`<text class="vl" x="${x0+j*bw+bw/2-1}" y="${yy-5}" text-anchor="middle">${f(v)}</text>`:`<text class="vl" transform="translate(${x0+j*bw+bw/2+2.5},${yy-4}) rotate(-90)" text-anchor="start">${f(v)}</text>`})}
    else{let acc=0;const T0t=tot[i]||1;series.forEach(se=>{const raw=se.v[i]||0;const v=mode==='pct'?raw/T0t:raw;if(v<=0)return;const y1=y(acc+v),y0=y(acc);acc+=v;
        s+=`<rect x="${cx-bw/2}" y="${y1}" width="${bw}" height="${Math.max(0.5,y0-y1)}" style="fill:var(${se.c})" data-tip="${esc(c)}\n${se.n}: ${T(raw)} ${unit} (${PC(raw/T0t)})"/>`;
        if(y0-y1>15&&bw>=26)s+=`<text x="${cx}" y="${(y0+y1)/2+4}" text-anchor="middle" style="fill:${se.dark?'var(--ink)':'#fff'};font:600 10.5px var(--f-mono)">${mode==='pct'?Math.round(v*100)+'%':vlab(v)}</text>`});
      {const st=sub?sub(i):vlab(tot[i]),yt=y(mode==='pct'?1:tot[i]);s+=String(st).length*6.6>gw-2?`<text class="vl" transform="translate(${cx+4},${yt-5}) rotate(-90)" text-anchor="start" style="font-size:10.5px">${st}</text>`:`<text class="vl" x="${cx}" y="${yt-7}" text-anchor="middle" style="font-size:11px">${st}</text>`}}
    const lab=c.length>22?c.slice(0,21)+'…':c,g=go?go(i):null,ga=g?` data-go="${esc(g)}" style="cursor:pointer;font-size:11px;fill:var(--ink)"`:' style="font-size:11px;fill:var(--ink)"';
    s+=flat?`<text x="${cx}" y="${h-B+16}" text-anchor="middle"${ga}>${esc(lab)}</text>`:`<text transform="translate(${cx-4},${h-B+12}) rotate(32)"${ga}><title>${esc(c)}</title>${esc(lab)}</text>`});
  ref.forEach(r=>{s+=`<line x1="${L}" x2="${W-R}" y1="${y(r.v)}" y2="${y(r.v)}" style="stroke:var(${r.c})" stroke-width="1.5" stroke-dasharray="6 4"/><text x="${W-R}" y="${y(r.v)-5}" text-anchor="end" style="fill:var(${r.c});font-size:10.5px">${esc(r.n)}</text>`});

/* cột nhỏ trong thẻ: items [{n, v, c, p?}] */
function miniCols(items,{h=180,W=340,unit='t',fmt=vlab}={}){
  W=Math.max(W,items.length*(Math.max(...items.map(x=>x.n.length))*6.4+12));
  const L=6,R=6,Tp=22,B=items.some(x=>x.p!=null)?42:28,n=items.length,gw=(W-L-R)/n,bw=Math.min(46,gw*0.6);const mx=Math.max(1e-9,...items.map(x=>x.v));const y=v=>Tp+(h-Tp-B)*(1-v/(mx*1.04));

  items.forEach((it,i)=>{const cx=L+i*gw+gw/2,yy=y(it.v);
    if(it.v>0)s+=`<rect x="${cx-bw/2}" y="${yy}" width="${bw}" height="${Math.max(1,h-B-yy)}" rx="2" style="fill:var(${it.c})" data-tip="${esc(it.n)}: ${fmt(it.v)} ${unit}${it.p!=null?' ('+PC(it.p)+')':''}"/>`;

    s+=`<text x="${cx}" y="${h-B+14}" text-anchor="middle" style="font-size:10.5px;fill:var(--ink)">${esc(it.n)}</text>`;
    if(it.p!=null)s+=`<text x="${cx}" y="${h-B+28}" text-anchor="middle" style="font-size:10.5px;font-weight:600">${PC(it.p)}</text>`});
  return `<svg viewBox="0 0 ${W} ${h}" width="100%" height="${h}" preserveAspectRatio="xMidYMid meet" style="display:block" role="img" aria-label="Biểu đồ cột nhỏ">${s}</svg>`}
/* thác nước: nhu cầu → trừ dần nguồn → còn thiếu */
function waterfall(steps,{h=230}={}){
  const W=MOB?340:560,L=46,R=8,Tp=26,B=40,n=steps.length,gw=(W-L-R)/n,bw=gw*0.56;const mx=Math.max(1e-9,...steps.map(s=>s.base+s.v));const[top,ticks]=nice(mx*1.12);const y=v=>Tp+(h-Tp-B)*(1-v/top);
  let s=ticks.map(t=>`<line class="grid-l" x1="${L}" x2="${W-R}" y1="${y(t)}" y2="${y(t)}"/><text x="${L-6}" y="${y(t)+4}" text-anchor="end">${T0(t)}</text>`).join('');
  steps.forEach((st,i)=>{const x=L+i*gw+(gw-bw)/2,y1=y(st.base+st.v),y0=y(st.base);
    s+=`<rect x="${x}" y="${y1}" width="${bw}" height="${Math.max(1,y0-y1)}" rx="2" style="fill:var(${st.col})" data-tip="${esc(st.n)}: ${T(st.v)} t"/>`;
    s+=`<text class="vl" x="${x+bw/2}" y="${y1-6}" text-anchor="middle" style="font-size:12px${st.col==='--bad'&&st.v>0.05?';fill:var(--bad)':''}">${st.sign||''}${T(st.v)}</text>`;
    s+=`<text x="${x+bw/2}" y="${h-B+16}" text-anchor="middle" style="font-size:11px;fill:var(--ink)">${esc(st.n)}</text>`;
    if(i<n-1){const nx=L+(i+1)*gw+(gw-bw)/2;const yy=y(st.base);s+=`<line x1="${x+bw}" x2="${nx}" y1="${yy}" y2="${yy}" style="stroke:var(--muted)" stroke-dasharray="3 3"/>`}});
  s+=`<line class="axis" x1="${L}" x2="${W-R}" y1="${h-B}" y2="${h-B}"/>`;
  return `<svg viewBox="0 0 ${W} ${h}" ${MOB?'width="100%"':svgB(W,h)} role="img" aria-label="Biểu đồ thác nước">${s}</svg>`}

/* sparkline: cột theo ngày hoặc đường */
function spark(v,{col='--brand',type='col',h=36}={}){
  const W=160,n=v.length;if(!n)return '';const mx=Math.max(1e-9,...v.map(Math.abs)),mn=type==='line'?Math.min(...v):0,rg=Math.max(1e-9,mx-mn);const y=q=>h-2-(h-6)*(q-mn)/rg;
  if(type==='col'){const bw=W/n;return `<svg class="spk" viewBox="0 0 ${W} ${h}" width="100%" height="${h}" preserveAspectRatio="none" aria-hidden="true">${v.map((q,i)=>q>0?`<rect x="${i*bw+0.6}" y="${y(q)}" width="${Math.max(0.8,bw-1.2)}" height="${h-2-y(q)}" style="fill:var(${col});opacity:${i===n-1?1:.55}"/>`:'').join('')}<line x1="0" x2="${W}" y1="${h-1.5}" y2="${h-1.5}" style="stroke:var(--line)"/></svg>`}
  const x=i=>n<2?W/2:i*(W-4)/(n-1)+2,pts=v.map((q,i)=>x(i).toFixed(1)+','+y(q).toFixed(1)).join(' ');
  return `<svg class="spk" viewBox="0 0 ${W} ${h}" width="100%" height="${h}" preserveAspectRatio="none" aria-hidden="true"><polygon points="2,${h-1} ${pts} ${W-2},${h-1}" style="fill:var(${col});opacity:.13"/><polyline points="${pts}" fill="none" style="stroke:var(${col})" stroke-width="1.8" vector-effect="non-scaling-stroke"/></svg>`}

  const rows=BUCK.map((b,i)=>{const L=list.filter(l=>bucketOf(l.age)===i);return{label:b[0],n:L.length,chua:sum(L.filter(l=>!l.pc),l=>l.rem),dang:sum(L.filter(l=>l.pc>0),l=>l.rem)}});

}
function projTable(){

    {h:'Dự án',f:p=>`<b>${esc(p.name)}</b><br><span style="color:var(--muted);font-size:11.5px">${esc(p.code||p.id)}</span>`,s:p=>p.name},

    {h:'Còn cắt (t)',n:1,f:p=>T(Math.max(0,p.req-p.cut)),s:p=>p.req-p.cut},

    {h:'Phôi chờ cắt (t)',n:1,f:p=>p.kho?T(p.kho.need):'–',s:p=>p.kho?p.kho.need:-1},
    {h:'Thiếu thép (t)',n:1,f:p=>{const v=buyOf(p);return v==null?'<span style="color:var(--muted)">chưa map kho</span>':v>0.05?`<b style="color:var(--bad)">${T(v)}</b>`:'0,0'},s:p=>buyOf(p)??-1},
    {h:'Cắt gần nhất',f:p=>p.last_cut||'–',s:p=>p.last_cut||''},
    {h:'Cảnh báo',n:1,f:p=>p.alerts.length||'–',s:p=>p.alerts.length},

}

V.sx={name:'Tiến độ LSX',title:'Tiến độ lệnh sản xuất (LSX)',ico:'<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',render(){

   <div class="card"><h3>Sản lượng đã cắt theo máy <span class="sub">· tấn, lũy kế</span></h3>${hbars(D.mach.slice(0,10).map(m=>({label:m.k,segs:[{v:m.t,c:'c-cut',n:'Đã cắt'}],right:`${T(m.t)} · ${PC(m.t/D.tot.cut)}`})),D.mach[0].t)}</div></div></section>
  <section>${secH('2. Cắt và bàn giao theo tháng'+info('Cắt: theo ngày cắt. Bàn giao: theo ngày bàn giao (đã chuẩn hóa). "Cắt − giao" dương = tháng đó cắt nhiều hơn giao, hàng tồn lại xưởng.'),'tấn · 12 tháng gần nhất')}
   <div class="g21"><div class="card">${cols([{n:'Cắt',v:D.m_cut,col:'--d1'},{n:'Bàn giao',v:D.m_bg,col:'--d2'}],MLAB,{h:300})}</div>
   <div class="card" style="padding:0;overflow:hidden">${table('t-m',[{h:'Tháng',f:r=>r.m,s:r=>r.m},{h:'Cắt',n:1,f:r=>T(r.c),s:r=>r.c},{h:'Bàn giao',n:1,f:r=>T(r.b),s:r=>r.b},{h:'Cắt − giao',n:1,f:r=>`<span style="color:${r.c-r.b>0.5?'var(--bad)':'var(--muted)'}">${T(r.c-r.b)}</span>`,s:r=>r.c-r.b}],mrows,{foot:['Tổng',T(sum(mrows,r=>r.c)),T(sum(mrows,r=>r.b)),T(sum(mrows,r=>r.c-r.b))]})}</div></div></section>

   ${table('t-stg',[{h:'Dự án',f:p=>`<b>${esc(p.name)}</b>`,s:p=>p.name},{h:'KL (t)',n:1,f:p=>T(p.kl),s:p=>p.kl},...Object.keys(st).map(s=>({h:st[s],n:1,f:p=>{const v=p.stages[s];return v.req>0.05?`${PC(v.done/v.req)}<span class="mini"><i style="width:${v.done/v.req*100}%"></i></span>`:'<span class="muted">–</span>'},s:p=>p.stages[s].req?p.stages[s].done/p.stages[s].req:-1})),{h:'Bàn giao',n:1,f:p=>`${PC(p.pb)}<span class="mini"><i style="width:${(p.pb||0)*100}%;background:var(--d2)"></i></span>`,s:p=>p.pb??-1},{h:'Còn cắt (t)',n:1,f:p=>`<b>${T(Math.max(0,p.req-p.cut))}</b>`,s:p=>p.req-p.cut}],act.map(p=>({...p,_id:p.id})),{click:1})}</section>

   <div class="g12"><div class="card"><h3>Theo nhóm tuổi <span class="sub">· tấn còn phải cắt</span></h3>${agingChart(openLsx)}
     <div class="kpis" style="margin-top:14px;grid-template-columns:repeat(3,1fr)">${kpi('Quá 30 ngày',openLsx.filter(l=>l.age>30).length,'lệnh',`${T(sum(openLsx.filter(l=>l.age>30),l=>l.rem))} t`,'bad')}${kpi('Chưa cắt lần nào',openLsx.filter(l=>!l.pc).length,'lệnh',`${T(sum(openLsx.filter(l=>!l.pc),l=>l.rem))} t`,'dim')}${kpi('Tuổi trung bình',T0(sum(openLsx,l=>l.age||0)/Math.max(1,openLsx.length)),'ngày','','dim')}</div></div>
    <div class="card"><h3>Dự án × nhóm tuổi <span class="sub">· tấn còn phải cắt, ô càng đậm càng nhiều</span></h3>
     ${table('t-age',[{h:'Dự án',f:r=>`<a data-sxp="${P.indexOf(r.p)}">${esc(r.p.name)}</a>`,s:r=>r.p.name},{h:'LSX',n:1,f:r=>r.n,s:r=>r.n},...BUCK.map((bk,i)=>({h:bk[0].replace(' ngày',''),n:1,f:r=>heat(r.b[i]),s:r=>r.b[i]})),{h:'Tổng (t)',n:1,f:r=>`<b>${T(r.rem)}</b>`,s:r=>r.rem}],ageRows,{foot:['Tổng',openLsx.length,...BUCK.map((_,i)=>T(sum(ageRows,r=>r.b[i]))),T(sum(openLsx,l=>l.rem))]})}
     <p class="note">Bấm tên dự án để lọc danh sách LSX bên dưới.</p></div></div></section>
  <section id="sx-list">${secH('5. Danh sách LSX chưa cắt xong','<span id="sx-cnt"></span>')}
   <div class="filters">
    <select id="sx-p" style="max-width:260px"><option value="">Tất cả dự án (${projOpen.length})</option>${projOpen.map(p=>`<option value="${P.indexOf(p)}">${esc(p.name)} · ${openLsx.filter(l=>l.p===p).length} LSX</option>`).join('')}</select>
    ${['Tất cả','Chưa cắt','Đang cắt'].map((s,i)=>`<button class="chip" data-sxs="${i?s:''}" aria-pressed="${i===0}">${s}</button>`).join('')}
    <span class="flab">Tuổi</span>${['Tất cả',...BUCK.map(b=>b[0])].map((s,i)=>`<button class="chip" data-sxa="${i-1}" aria-pressed="${i===0}">${s}</button>`).join('')}
    <input type="search" id="sx-q" placeholder="Tìm LSX, hạng mục, máy…" aria-label="Tìm LSX">
    <label style="font-size:12.5px;display:inline-flex;gap:5px;align-items:center"><input type="checkbox" id="sx-g"> Nhóm theo dự án</label></div>
   <div id="sx-box"></div></section>`;},
 after(){
  const F={p:'',s:'',a:-1,q:'',g:false};
  const draw=()=>{let L=openLsx.filter(l=>(F.p===''||l.p===P[+F.p])&&(!F.s||l.st===F.s)&&(F.a<0||bucketOf(l.age)===F.a)&&(!F.q||(l.lsx+' '+(l.hm||'')+' '+(l.may||'')).toLowerCase().includes(F.q)));
    L=L.slice().sort((a,b)=>(b.age??-1)-(a.age??-1));
    $('sx-cnt').textContent=`${L.length} lệnh · ${T(sum(L,l=>l.rem))} t còn phải cắt`;
    const cols=[{h:'LSX',f:l=>`<b>${esc(l.lsx)}</b>`,s:l=>l.lsx},...(F.g?[]:[{h:'Dự án',f:l=>`<a data-go="${esc(l.p.id)}">${esc(l.p.name)}</a>`,s:l=>l.p.name}]),{h:'Hạng mục',w:1,f:l=>esc(l.hm||''),s:l=>l.hm||''},{h:'Ban hành',f:l=>l.bh?l.bh.split('-').reverse().join('/'):'–',s:l=>l.bh||''},{h:'Tuổi',n:1,f:l=>ageCell(l.age),s:l=>l.age??-1},{h:'KL lệnh (t)',n:1,f:l=>T(l.kl),s:l=>l.kl},{h:'% đã cắt',n:1,f:l=>`${PC(l.pc)}<span class="mini"><i style="width:${(l.pc||0)*100}%"></i></span>`,s:l=>l.pc??0},{h:'Còn cắt (t)',n:1,f:l=>`<b>${T(l.rem)}</b>`,s:l=>l.rem},{h:'Trạng thái',f:l=>stPill(l.st),s:l=>l.st},{h:'Máy',f:l=>esc(l.may||''),s:l=>l.may||''}];
    if(!F.g){$('sx-box').innerHTML=table('t-open',cols,L,{foot:['Tổng','','','','',T(sum(L,l=>l.kl)),'',T(sum(L,l=>l.rem)),'','']})}
    else{const ps=[...new Set(L.map(l=>l.p))];$('sx-box').innerHTML=ps.map(p=>{const G=L.filter(l=>l.p===p);return `<details class="grp" open><summary><b>${esc(p.name)}</b><span class="muted"> · ${G.length} LSX · còn ${T(sum(G,l=>l.rem))} t · cũ nhất ${Math.max(...G.map(l=>l.age||0))} ngày</span></summary>${table('t-o'+P.indexOf(p),cols,G)}</details>`}).join('')||'<p class="empty">Không có LSX phù hợp.</p>'}
    sortable($('sx-box'));};
  $('sx-p').onchange=e=>{F.p=e.target.value;draw()};
  $('view').querySelectorAll('[data-sxs]').forEach(b=>b.onclick=()=>{F.s=b.dataset.sxs;$('view').querySelectorAll('[data-sxs]').forEach(x=>x.setAttribute('aria-pressed',x===b));draw()});
  $('view').querySelectorAll('[data-sxa]').forEach(b=>b.onclick=()=>{F.a=+b.dataset.sxa;$('view').querySelectorAll('[data-sxa]').forEach(x=>x.setAttribute('aria-pressed',x===b));draw()});

  $('view').querySelectorAll('[data-sxp]').forEach(a=>a.onclick=()=>{F.p=a.dataset.sxp;$('sx-p').value=F.p;draw();$('sx-list').scrollIntoView({behavior:'smooth'})});
  draw();}};

    ${D.kho_only.length?`<h3 style="margin-top:16px">Tồn của dự án chưa có lệnh cắt</h3>${hbars(D.kho_only.map(r=>({label:r.k,segs:[{v:r.t,c:'c-own',n:'Tồn'}],right:T(r.t)+' t'})),Math.max(1,...D.kho_only.map(r=>r.t)))}`:''}</div></section>

/* thanh ngang có trục: rows [{n, v, tot?, c?}] — tot = phần nền nhạt (100%) */
function hrows(rows,{base=null,unit='t'}={}){
  const mx=Math.max(1e-9,...rows.map(r=>Math.max(r.v,r.tot||0)));const[top,ticks]=nice(mx*1.6);const w=v=>Math.max(0,v)/top*100;

    sortable($('lsx-box'));};

/* ================= BÁO CÁO THEO KỲ: ngày / tuần / tháng / quý / năm ================= */
const DAY=864e5, D0=Date.parse(D.ev.d0+'T00:00:00Z'), DEND=Date.parse(D.date+'T00:00:00Z');
const MACH=D.ev.mach;
const STG=[{k:0,n:'Cắt',c:'--s0'},{k:1,n:'Khoan',c:'--s1'},{k:2,n:'Chấn / lốc',c:'--s2'},{k:3,n:'Vát mép',c:'--s3'},{k:4,n:'Bàn giao',c:'--s4'},{k:5,n:'KL lệnh ban hành',c:'--s5'},{k:6,n:'Kho xuất thép',c:'--s6'}];
const isoD=t=>new Date(t).toISOString().slice(0,10);
const dm=t=>{const d=new Date(t);return String(d.getUTCDate()).padStart(2,'0')+'/'+String(d.getUTCMonth()+1).padStart(2,'0')};
const dmy=t=>dm(t)+'/'+new Date(t).getUTCFullYear();
const parseD=s=>{const t=Date.parse(s+'T00:00:00Z');return isNaN(t)?null:t};
function isoWeek(t){const wd=(new Date(t).getUTCDay()+6)%7;const th=t-wd*DAY+3*DAY;const y=new Date(th).getUTCFullYear();return {y,w:Math.floor((th-Date.UTC(y,0,1))/DAY/7)+1}}
function pkey(t,g){const d=new Date(t),y=d.getUTCFullYear(),m=d.getUTCMonth();
  if(g==='day')return isoD(t);
  if(g==='week'){const wd=(d.getUTCDay()+6)%7;return isoD(t-wd*DAY)}
  if(g==='month')return y+'-'+String(m+1).padStart(2,'0');
  if(g==='quarter')return y+'-Q'+(Math.floor(m/3)+1);
  return String(y)}
function plabel(k,g){
  if(g==='day')return dm(parseD(k));
  if(g==='week'){const w=isoWeek(parseD(k));return 'W'+w.w+' · '+dm(parseD(k))}
  if(g==='month'){const[y,m]=k.split('-');return 'T'+(+m)+'/'+y.slice(2)}
  if(g==='quarter'){const[y,q]=k.split('-');return q+'/'+y.slice(2)}
  return k}
function periods(from,to,g){const ks=[];let last=null;for(let t=from;t<=to;t+=DAY){const k=pkey(t,g);if(k!==last){ks.push(k);last=k}}return ks}
const workdays=(from,to)=>{let n=0;for(let t=from;t<=to;t+=DAY){if(new Date(t).getUTCDay()!==0)n++}return n};
const GLAB={day:'Ngày',week:'Tuần',month:'Tháng',quarter:'Quý',year:'Năm'};
const MONTH0=t=>{const d=new Date(t);return Date.UTC(d.getUTCFullYear(),d.getUTCMonth(),1)};
const QUICK={
  d1:{n:'Ngày số liệu',f:()=>[DEND,DEND],g:'day'},
  d7:{n:'7 ngày',f:()=>[DEND-6*DAY,DEND],g:'day'},
  d30:{n:'30 ngày',f:()=>[DEND-29*DAY,DEND],g:'day'},
  mtd:{n:'Tháng này',f:()=>[MONTH0(DEND),DEND],g:'day'},
  m3:{n:'3 tháng',f:()=>{const d=new Date(DEND);return[Date.UTC(d.getUTCFullYear(),d.getUTCMonth()-2,1),DEND]},g:'week'},
  qtd:{n:'Quý này',f:()=>{const d=new Date(DEND);return[Date.UTC(d.getUTCFullYear(),Math.floor(d.getUTCMonth()/3)*3,1),DEND]},g:'week'},
  ytd:{n:'Năm nay',f:()=>[Date.UTC(new Date(DEND).getUTCFullYear(),0,1),DEND],g:'month'},
  all:{n:'Tất cả',f:()=>[D0,DEND],g:'month'}};
const _early=new Date(DEND).getUTCDate()<8;
const FS={q:_early?'d30':'mtd',g:'day',from:_early?DEND-29*DAY:MONTH0(DEND),to:DEND,p:'',m:'',ser:[0,4],piv:0,by:'p'};
try{const s=JSON.parse(localStorage.getItem('chuoi-fs')||'null');if(s&&s.from>=D0&&s.to<=DEND)Object.assign(FS,s)}catch(e){}
const saveFS=()=>{try{localStorage.setItem('chuoi-fs',JSON.stringify(FS))}catch(e){}};
function getTarget(monthKey){let v=null;try{v=JSON.parse(localStorage.getItem('chuoi-target')||'{}')[monthKey]}catch(e){}
  const cfg=D.target.by_month[monthKey];return v!=null?{v:+v,src:'nhập tay'}:cfg&&cfg.cut?{v:cfg.cut,src:'file cấu hình'}:{v:D.target.base,src:'TB 3 tháng gần nhất'}}

function agg(from,to,g,{p=FS.p,m=FS.m}={}){
  const keys=periods(from,to,g),ix=new Map(keys.map((k,i)=>[k,i]));
  const S=STG.map(()=>new Array(keys.length).fill(0)),tot=new Array(7).fill(0);
  const byP={},byM={},days=new Map();
  for(const r of D.ev.rows){const t=D0+r[0]*DAY;if(t<from||t>to)continue;
    if(p!==''&&r[1]!==+p)continue;
    if(m!==''&&(r[3]>4||r[2]!==+m))continue;
    const i=ix.get(pkey(t,g));S[r[3]][i]+=r[4];tot[r[3]]+=r[4];
    (byP[r[1]]=byP[r[1]]||new Array(7).fill(0))[r[3]]+=r[4];
    if(r[2]>=0)(byM[r[2]]=byM[r[2]]||new Array(7).fill(0))[r[3]]+=r[4];
    if(r[3]===0)days.set(t,(days.get(t)||0)+r[4]);}
  return {keys,S,tot,byP,byM,days}}
function backlog(to,p){let c=0,b=0;for(const r of D.ev.rows){if(D0+r[0]*DAY>to)continue;if(p!==''&&r[1]!==+p)continue;if(r[3]===0)c+=r[4];else if(r[3]===4)b+=r[4]}return c-b}
const delta=(a,b)=>{if(!b)return '';const d=(a-b)/b;return `<span class="dl ${d>=0?'up':'dn'}">${d>=0?'▲':'▼'} ${nf1.format(Math.abs(d*100))}%</span>`};

function filterBar(){
  const pOpt=P.map((p,i)=>`<option value="${i}" ${FS.p===String(i)?'selected':''}>${esc(p.name)}</option>`).join('');
  const mOpt=MACH.map((m,i)=>`<option value="${i}" ${FS.m===String(i)?'selected':''}>${esc(m)}</option>`).join('');
  return `<div class="fbar">
   <div class="frow"><span class="flab">Kỳ</span><div class="seg">${Object.entries(GLAB).map(([k,n])=>`<button data-g="${k}" aria-pressed="${FS.g===k}">${n}</button>`).join('')}</div>
    <span class="flab">Nhanh</span>${Object.entries(QUICK).map(([k,q])=>`<button class="chip" data-q="${k}" aria-pressed="${FS.q===k}">${q.n}</button>`).join('')}
</div>
   <div class="frow"><span class="flab">Từ</span><input type="date" id="f-from" value="${isoD(FS.from)}" min="${D.ev.d0}" max="${D.date}"><span class="flab">đến</span><input type="date" id="f-to" value="${isoD(FS.to)}" min="${D.ev.d0}" max="${D.date}">
    <span class="flab">Dự án</span><select id="f-p" style="max-width:240px"><option value="">Tất cả dự án</option>${pOpt}</select>
    <span class="flab">Máy</span><select id="f-m" style="max-width:220px"><option value="">Tất cả máy</option>${mOpt}</select>
    ${(FS.p!==''||FS.m!==''||FS.q!=='mtd')?`<button class="chip xoa" id="f-clear">✕ Xóa lọc</button>`:''}
    <span class="fsum">${dmy(FS.from)} → ${dmy(FS.to)} · ${workdays(FS.from,FS.to)} ngày làm việc</span></div></div>`}
function bindFilter(rerender){
  const root=$('view');
  root.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>{FS.g=b.dataset.g;saveFS();rerender()});
  root.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{const q=QUICK[b.dataset.q];[FS.from,FS.to]=q.f();FS.from=Math.max(FS.from,D0);FS.g=q.g;FS.q=b.dataset.q;saveFS();rerender()});
  const fd=()=>{const a=parseD($('f-from').value),b=parseD($('f-to').value);if(a!=null&&b!=null&&a<=b){FS.from=Math.max(a,D0);FS.to=Math.min(b,DEND);FS.q='';const n=(FS.to-FS.from)/DAY;FS.g=n<=45?'day':n<=150?'week':n<=500?'month':'quarter';saveFS();rerender()}};
  $('f-from').onchange=fd;$('f-to').onchange=fd;
  $('f-p').onchange=e=>{FS.p=e.target.value;saveFS();rerender()};
  $('f-m').onchange=e=>{FS.m=e.target.value;saveFS();rerender()};
  const c=$('f-clear');if(c)c.onclick=()=>{FS.p='';FS.m='';FS.q='mtd';FS.from=MONTH0(DEND);FS.to=DEND;FS.g='day';saveFS();rerender()};
}

/* ---- charts ---- */
function barLine(keys,g,series,{h=280,ma=null,unit='t'}={}){
  const W=MOB?Math.max(380,keys.length*series.length*(keys.length*series.length<=80?17:9)+70):900,L=50,R=12,Tp=14,B=34,n=keys.length,gw=(W-L-R)/Math.max(1,n),k=series.length,bw=Math.max(2,Math.min(26,(gw-4)/k));
  const mx0=Math.max(1e-9,...series.flatMap(s=>s.v),...(ma?ma.v:[0]));const showL=n*k<=80,rot=bw<22;const mx=showL?mx0*(rot?1.22:1.1):mx0;const[top,ticks]=nice(mx);const y=v=>Tp+(h-Tp-B)*(1-v/top);
  const minL=mx0*0.015;const step=MOB?Math.max(1,Math.ceil(n/Math.max(1,Math.floor((W-60)/52)))):Math.ceil(n/(g==='day'?16:14));
  let s=ticks.map(t=>`<line class="grid-l" x1="${L}" x2="${W-R}" y1="${y(t)}" y2="${y(t)}"/><text x="${L-6}" y="${y(t)+4}" text-anchor="end">${T0(t)}</text>`).join('');
  keys.forEach((kk,i)=>{const x0=L+i*gw+(gw-bw*k)/2;const lb=plabel(kk,g);
    series.forEach((se,j)=>{const v=se.v[i]||0,yy=y(v);if(v>0){s+=`<rect x="${x0+j*bw}" y="${yy}" width="${Math.max(1,bw-1.5)}" height="${h-B-yy}" rx="1.5" style="fill:var(${se.c})" data-tip="${lb}\n${se.n}: ${T(v)} ${unit}"></rect>`;
      if(showL&&v>=minL){const cx=x0+j*bw+bw/2-.75;s+=rot?`<text class="vl" transform="translate(${cx+3.5},${yy-4}) rotate(-90)" text-anchor="start">${vlab(v)}</text>`:`<text class="vl" x="${cx}" y="${yy-4}" text-anchor="middle">${vlab(v)}</text>`}}});
    if(i%step===0)s+=`<text x="${L+i*gw+gw/2}" y="${h-14}" text-anchor="middle">${lb.split(' · ')[0]}</text>`});
  if(ma){const pts=ma.v.map((v,i)=>v==null?null:`${L+i*gw+gw/2},${y(v)}`).filter(Boolean).join(' ');
    s+=`<polyline points="${pts}" fill="none" style="stroke:var(--ink)" stroke-width="2" stroke-linejoin="round" opacity=".75"/>`;}
  s+=`<line class="axis" x1="${L}" x2="${W-R}" y1="${h-B}" y2="${h-B}"/>`;
  const leg=series.map(se=>`<span><i style="background:var(${se.c})"></i>${se.n}</span>`).join('')+(ma?`<span><i style="background:var(--ink);height:2px;opacity:.75"></i>${ma.n}</span>`:'');
  return `<div class="legend">${leg}</div><div class="chart-x${MOB&&W>400?' hint':''}"><svg viewBox="0 0 ${W} ${h}" ${svgW(W)} role="img" aria-label="Biểu đồ theo kỳ">${s}</svg></div>`}
function pctLine(keys,g,v,{h=190,target=0.95}={}){

  const piv=FS.piv;
  const pr=P.map((q,i)=>{const r=agg(from,to,g,{p:String(i)});return {i,n:q.name,v:r.S[piv],t:r.tot[piv]}}).filter(x=>x.t>0.0005).sort((a,b)=>b.t-a.t);
  const tsv=[['Kỳ',...STG.map(s=>s.n+' (t)'),'Bàn giao / cắt'].join('\t'),...rows.map(r=>[r.l,...r.v.map(x=>x.toFixed(3).replace('.',',')),r.v[0]?(r.v[4]/r.v[0]*100).toFixed(1).replace('.',',')+'%':''].join('\t'))].join('\n');
  window._tsv=tsv;
  return filterBar()+`
  <section>${secH(`Báo cáo theo ${GLAB[g].toLowerCase()}`,`${rows.length} kỳ · ${dmy(from)} → ${dmy(to)}${FS.p!==''?' · '+esc(P[+FS.p].name):''}${FS.m!==''?' · '+esc(MACH[+FS.m]):''}`)}
   <div class="filters"><button class="b" id="bc-copy">Sao chép bảng (dán vào Excel)</button><span class="muted" id="bc-msg"></span></div>
   ${table('t-bc',[{h:GLAB[g],f:r=>`<b>${r.l}</b>`,s:r=>r.k},...STG.map(s=>({h:s.n,n:1,f:r=>r.v[s.k]>0.0005?T(r.v[s.k]):'<span class="muted">–</span>',s:r=>r.v[s.k]})),{h:'BG / cắt',n:1,f:r=>r.v[0]>0.05?`<span style="color:${r.v[4]/r.v[0]<0.95?'var(--bad)':'var(--good)'}">${PC(r.v[4]/r.v[0])}</span>`:'–',s:r=>r.v[0]?r.v[4]/r.v[0]:-1}],rows,{foot:['Tổng',...STG.map(s=>T(A.tot[s.k])),PC(A.tot[0]?A.tot[4]/A.tot[0]:null)]})}</section>
  <section>${secH('Dự án × kỳ',`chỉ tiêu: ${STG[piv].n} (tấn)`)}
   <div class="filters">${STG.map(s=>`<button class="chip" data-piv="${s.k}" aria-pressed="${piv===s.k}"><i class="sw" style="background:var(${s.c})"></i>${s.n}</button>`).join('')}</div>
   ${keys.length>40?'<p class="note">Nhiều kỳ quá để xem dạng bảng ngang; chọn kỳ Tuần/Tháng hoặc rút ngắn khoảng ngày.</p>':table('t-piv',[{h:'Dự án',f:x=>`<a data-go="${esc(P[x.i].id)}">${esc(x.n)}</a>`,s:x=>x.n},...keys.map((k,j)=>({h:plabel(k,g).split(' · ')[0],n:1,f:x=>x.v[j]>0.0005?T(x.v[j]):'<span class="muted">·</span>',s:x=>x.v[j]})),{h:'Tổng',n:1,f:x=>`<b>${T(x.t)}</b>`,s:x=>x.t}],pr,{foot:['Tổng',...keys.map((k,j)=>T(A.S[piv][j])),T(A.tot[piv])]})}</section>`;
},after(){
  const re=()=>show('v','bc');bindFilter(re);
  $('view').querySelectorAll('[data-piv]').forEach(b=>b.onclick=()=>{FS.piv=+b.dataset.piv;saveFS();re()});
  $('bc-copy').onclick=()=>{navigator.clipboard.writeText(window._tsv).then(()=>$('bc-msg').textContent='Đã sao chép, dán vào Excel.').catch(()=>{$('bc-msg').textContent='Trình duyệt chặn sao chép.'})};
}};

/* ---------- navigation ---------- */
const nav=$('nav'),plist=$('plist');
const cnt={ov:'',sx:openLsx.length,th:D.bal.buy>0.05?'!':'',ne:P.filter(p=>p.nes).length,src:''};
const ORDER=['dh','bc','ov','sx','th','ne'];cnt.dh='';cnt.bc='';
nav.innerHTML=ORDER.map((k,i)=>{const v=V[k];return `<button data-v="${k}"><svg viewBox="0 0 24 24" aria-hidden="true">${v.ico}</svg><span><small style="opacity:.6;font:600 10px var(--f-mono);margin-right:6px">${String(i+1).padStart(2,'0')}</small>${v.name}</span>${cnt[k]!==''&&cnt[k]!=null?`<span class="cnt">${cnt[k]}</span>`:''}</button>`}).join('');
plist.innerHTML=P.slice().sort((a,b)=>{const g=p=>p.pc==null?2:p.pc>=0.999?1:0;return g(a)-g(b)||(a.pc??0)-(b.pc??0)||b.kl-a.kl}).map(p=>{const hs=health(p);return `<button data-p="${esc(p.id)}" title="${esc(p.name)} · ${hs.t}"><span class="dot dot-${hs.c}"></span><span class="nm">${esc(p.name)}</span><span class="pc">${p.pc==null?'–':Math.round(p.pc*100)+'%'}</span><span class="bar"><i style="width:${(p.pc||0)*100}%"></i></span></button>`}).join('');
function show(kind,key){
  nav.querySelectorAll('button').forEach(b=>b.setAttribute('aria-current',kind==='v'&&b.dataset.v===key));
  plist.querySelectorAll('button').forEach(b=>b.setAttribute('aria-current',kind==='p'&&b.dataset.p===key));
  if(kind==='p'){const p=P.find(x=>x.id===key)||P[0];$('crumb').textContent='Chi tiết dự án';$('title').textContent=p.name;renderProject(p)}
  else{const v=V[key]||V.dh;$('crumb').textContent=v.name;$('title').textContent=v.title;$('view').innerHTML=v.render();sortable($('view'));if(v.after)v.after()}
  try{localStorage.setItem('chuoi-view2',JSON.stringify({kind,key}))}catch(e){}
  $('rail').classList.remove('open');$('menu').setAttribute('aria-expanded','false');
  window.scrollTo({top:0});
}
nav.addEventListener('click',e=>{const b=e.target.closest('button');if(b)show('v',b.dataset.v)});
plist.addEventListener('click',e=>{const b=e.target.closest('button');if(b)show('p',b.dataset.p)});
document.addEventListener('click',e=>{const g=e.target.closest('[data-go]');if(g)show('p',g.dataset.go)});
document.addEventListener('keydown',e=>{if(e.key==='Enter'){const g=e.target.closest('[data-go]');if(g)show('p',g.dataset.go)}});
$('lnk-src').onclick=e=>{e.preventDefault();show('v','src')};
$('menu').onclick=()=>{const o=$('rail').classList.toggle('open');$('menu').setAttribute('aria-expanded',o)};
const tip=$('tip');
document.addEventListener('focusin',e=>{const t=e.target.closest('.ii');if(t){const r=t.getBoundingClientRect();tip.textContent=t.dataset.tip;tip.style.display='block';tip.style.left=Math.min(r.left,innerWidth-tip.offsetWidth-8)+'px';tip.style.top=(r.bottom+6)+'px'}});
document.addEventListener('mousemove',e=>{const t=e.target.closest('[data-tip]');if(!t){tip.style.display='none';return}
  tip.textContent=t.dataset.tip;tip.style.display='block';tip.style.left=Math.min(e.clientX+12,innerWidth-tip.offsetWidth-8)+'px';tip.style.top=(e.clientY+14)+'px'});
try{const th=localStorage.getItem('chuoi-theme');if(th)document.documentElement.dataset.theme=th}catch(e){}
$('theme').onclick=()=>{const cur=document.documentElement.dataset.theme||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');const nx=cur==='dark'?'light':'dark';document.documentElement.dataset.theme=nx;try{localStorage.setItem('chuoi-theme',nx)}catch(e){}};
if(/github\.io$/.test(location.hostname)){$('prn').hidden=false;$('prn').onclick=()=>window.print()}
const dd=D.date.split('-').reverse().join('/');
const fd=x=>x?x.split('-').reverse().slice(0,2).join('/'):'';const dateNote=(D.files.d_cut&&D.files.d_kho&&D.files.d_cut!==D.files.d_kho)?` · Cutting ${fd(D.files.d_cut)} · Tồn kho ${fd(D.files.d_kho)}`:'';
$('asof').textContent=`Số liệu ngày ${dd}${dateNote}`;$('dchip').title=dateNote?`File Cutting ngày ${fd(D.files.d_cut)}, file tồn kho ngày ${fd(D.files.d_kho)}: phần kho tính theo ngày ${fd(D.files.d_kho)}`:'';$('dchip').textContent=`Số liệu ${dd}`;
let st=null;try{st=JSON.parse(localStorage.getItem('chuoi-view2')||'null')}catch(e){}
if(st&&st.kind==='p'&&P.some(p=>p.id===st.key))show('p',st.key);else if(st&&st.kind==='v'&&V[st.key])show('v',st.key);else show('v','dh');
</script>
